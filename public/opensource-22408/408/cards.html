<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>408 原子知识卡片</title>
<style>
:root{--ink:#233246;--muted:#6c7d90;--line:#dce5ee;--blue:#326b9b;--paper:#f4f7fa}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
#cards-root{max-width:1100px;margin:auto;padding:28px 20px 70px}header>a{color:var(--blue);text-decoration:none;font-size:13px}.eyebrow{margin:25px 0 4px;color:var(--blue);font-size:11px;letter-spacing:3px;font-weight:800}h1{font-size:clamp(28px,5vw,42px);margin:0}.sub{color:var(--muted);margin:8px 0 18px}.stats{display:flex;align-items:baseline;gap:8px;color:var(--muted);font-size:12px}.stats b{font-size:22px;color:var(--blue);margin-left:14px}.stats b:first-child{margin-left:0}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0 15px}button{font:inherit;cursor:pointer}nav button,.actions button{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 13px;color:var(--muted)}nav button.active{background:#e4eff8;border-color:#a9c5df;color:#245d8c;font-weight:700}
.tools{display:flex;gap:14px;align-items:center;margin:14px 0 20px}.tools input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff}.tools span{font-size:12px;color:var(--muted);white-space:nowrap}
.atom{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 4px 18px #20385008}.atom-top{display:flex;justify-content:space-between;gap:12px;color:var(--blue);font-size:12px;font-weight:700}.atom-top small{color:#8191a2;font-weight:500}.atom h2{font-size:20px;margin:12px 0 8px}.definition{font-size:14px;line-height:1.85;color:#43566a;margin:0}.keypoint{margin-top:12px;padding:11px 13px;border-left:3px solid #78a8ce;background:#f5f9fc;border-radius:0 8px 8px 0}.keypoint b{font-size:11px;color:var(--blue)}.keypoint p{font-size:13px;line-height:1.7;margin:4px 0 0;color:#53677c}
.lab{margin-top:17px;border:1px solid #d7e5f0;border-radius:12px;padding:14px;background:linear-gradient(135deg,#f1f7fc,#fbfdff)}.lab-head{display:flex;justify-content:space-between;color:#285c88;font-size:13px}.step{font:12px ui-monospace;color:#71879c}.scene{min-height:92px;margin:11px 0 8px;padding:12px;border-radius:9px;background:#fff;border:1px solid #e2ebf2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}.scene-title{font-size:12px;color:#72869a}.tokens{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.tokens span{padding:9px 12px;background:#eaf3fb;border:1px solid #b7cfe3;color:#285b85;border-radius:8px;font-size:12px;font-weight:700;animation:pop .24s ease both;animation-delay:calc(var(--i)*40ms)}.explain{font-size:12px;color:#526b83;margin:8px 0}.meter{height:5px;background:#e1eaf1;border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;background:#6296c0;transition:width .25s}.actions{display:flex;gap:7px;margin-top:10px}.actions button{padding:6px 10px;font-size:12px}.actions button:disabled{opacity:.35;cursor:not-allowed}@keyframes pop{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-width:600px){#cards-root{padding:18px 13px 50px}.atom{padding:16px}.atom-top{flex-direction:column;gap:4px}}
</style></head><body><div id="cards-root"></div><script src="cards-app.js"></script></body></html>

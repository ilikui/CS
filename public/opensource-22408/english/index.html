    <style>
        :root{--sidebar-width:260px;--primary:#c0392b;--primary-light:rgba(192,57,43,0.08);--bg:#f8f6f3;--text:#2c2c2c;--text-secondary:#777;--border:rgba(0,0,0,0.06)}
        *{margin:0;padding:0;box-sizing:border-box}
        body,html{height:100%;width:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);overflow:hidden;user-select:none}
        .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-width);background:rgba(255,255,255,0.85);backdrop-filter:blur(16px);border-right:1px solid var(--border);overflow-y:auto;z-index:100;padding:16px 0;transition:transform .3s cubic-bezier(0.16,1,0.3,1)}
        .sidebar::-webkit-scrollbar{width:4px}
        .sidebar::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.08);border-radius:4px}
        .sidebar-section{padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.04)}
        .sidebar-section:last-child{border-bottom:none}
        .sidebar-title{font-size:10px;text-transform:uppercase;letter-spacing:3px;color:var(--primary);font-weight:800;padding:0 18px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
        .sidebar-title::after{content:'▾';font-size:10px;transition:transform .2s;color:var(--text-secondary)}
        .sidebar-section.collapsed .sidebar-title::after{transform:rotate(-90deg)}
        .sidebar-section.collapsed .sidebar-section-body{display:none}
        .nav-btns{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);display:flex;gap:16px;pointer-events:auto}
        .nav-btn{width:56px;height:56px;border-radius:50%;border:1px solid rgba(0,0,0,0.08);background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.3s cubic-bezier(0.16,1,0.3,1);font-size:22px;color:var(--text-secondary)}
        .nav-btn:hover{border-color:rgba(192,57,43,0.3);color:var(--primary);background:rgba(255,255,255,0.95)}
        .nav-btn:active{transform:scale(0.92)}
        .nav-btn:disabled{opacity:0.3;cursor:not-allowed}
        .sidebar-back{display:flex;align-items:center;gap:6px;padding:8px 18px;color:var(--text-secondary);text-decoration:none;font-size:13px;font-weight:500;transition:.2s}
        .sidebar-back:hover{color:var(--primary)}
        .sidebar .pill{display:block;margin:4px 12px;width:calc(100% - 24px);text-align:left}
        .sidebar .search-box{padding:0 12px}
        .sidebar .search-box input{width:100%}
        .sidebar .search-box input:focus{width:100%}
        .menu-toggle{display:none;position:fixed;top:12px;left:12px;z-index:150;background:rgba(255,255,255,0.85);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:18px;cursor:pointer;color:var(--text)}
        .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:90}
        .sidebar-overlay.show{display:block}
        .pill{padding:4px 12px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid rgba(0,0,0,0.08);background:#fff;color:#777;transition:0.3s cubic-bezier(0.16,1,0.3,1);white-space:nowrap}
        .pill:hover{background:rgba(192,57,43,0.04);color:var(--primary);border-color:rgba(192,57,43,0.15)}
        .pill.active{background:var(--primary-light);color:var(--primary);border-color:rgba(192,57,43,0.2)}
        .pill.active-sub{background:rgba(192,57,43,0.1);color:var(--primary);border-color:rgba(192,57,43,0.2)}
        .pill.gp{background:rgba(192,57,43,0.06);color:var(--primary);border-color:rgba(192,57,43,0.12);font-weight:600}
        .pill.gp.active{background:rgba(192,57,43,0.1);border-color:rgba(192,57,43,0.2)}
        .tag{font-size:13px;font-weight:bold;color:#999;background:rgba(0,0,0,0.03);padding:5px 10px;border-radius:8px}
        .search-box{pointer-events:auto}
        .search-box input{padding:5px 12px;border-radius:20px;border:1px solid rgba(0,0,0,0.08);font-size:14px;outline:none;transition:0.3s cubic-bezier(0.16,1,0.3,1);background:#fff;color:var(--text)}
        .search-box input:focus{border-color:rgba(192,57,43,0.3)}
        .search-box input::placeholder{color:#ccc}
        #main-screen{height:100%;margin-left:var(--sidebar-width);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;position:relative}
        .word-card{width:90%;max-width:800px;padding:20px}
        .word-line{font-size:72px;font-weight:800;margin-bottom:8px;letter-spacing:-1px}
        #dw[role="button"]{cursor:pointer;display:inline-block;outline-offset:8px}
        #dw[role="button"]:hover{color:var(--accent);text-shadow:0 5px 18px rgba(66,107,143,.12)}
        #dw[role="button"]:active{transform:scale(.985)}
        .pronunciation-bar{display:flex;justify-content:center;gap:10px;margin:12px 0 20px}
        .pronunciation-btn{border:1px solid rgba(192,57,43,.18);background:#fff;color:var(--primary);border-radius:22px;padding:8px 16px;font-size:13px;font-weight:650;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px}
        .pronunciation-btn:hover{background:var(--primary-light);border-color:rgba(192,57,43,.35);transform:translateY(-1px)}
        .pronunciation-btn:active{transform:scale(.97)}
        .pronunciation-btn:disabled{opacity:.55;cursor:wait}
        .pronunciation-status{font-size:11px;color:#999;min-height:16px;margin-top:-12px;margin-bottom:8px}
        @media(max-width:768px){.pronunciation-btn{padding:8px 13px;font-size:12px}}

        .def-item{font-size:26px;line-height:1.5;margin-bottom:8px;color:#1d1d1f}
        .page-info{font-size:14px;color:#999;margin-top:16px}
        #fav-btn.active{color:#FF3B30}
        .hint{position:absolute;bottom:16px;font-size:12px;color:#ccc}
        #sr{display:none;position:fixed;top:50%;left:calc(var(--sidebar-width) + (100% - var(--sidebar-width)) / 2);transform:translate(-50%,-50%);width:90%;max-width:560px;max-height:65vh;overflow-y:auto;background:#fff;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.15);z-index:110;padding:10px}
        #sr.show{display:block}
        .si{padding:8px 12px;border-radius:10px;cursor:pointer;border-bottom:1px solid rgba(0,0,0,0.04)}
        .si:hover{background:rgba(192,57,43,0.02)}
        .si:last-child{border-bottom:none}
        .si-w{font-size:17px;font-weight:700}
        .si-d{font-size:13px;color:#999;margin-top:2px}
        .si-p{font-size:11px;color:var(--primary);margin-top:1px}
        #bv{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:200;overflow-y:auto;padding:16px;box-sizing:border-box}
        #bv.show{display:block}
        .bg{margin-bottom:20px}
        .bgt{font-size:17px;font-weight:700;color:var(--primary);padding:8px 0;border-bottom:2px solid rgba(192,57,43,0.15);margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
        .bgt .ct{font-size:13px;color:#999;font-weight:400}
        .bgt .ar{transition:transform .2s}
        .bgt.hid .ar{transform:rotate(-90deg)}
        .bw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}
        .bw-grid.hid{display:none}
        .bw-item{padding:8px 12px;border-radius:10px;border:1px solid rgba(0,0,0,0.06);cursor:pointer;transition:0.3s cubic-bezier(0.16,1,0.3,1)}
        .bw-item:hover{border-color:rgba(192,57,43,0.2);background:rgba(192,57,43,0.02)}
        .bw-item .bw-w{font-size:15px;font-weight:600}
        .bw-item .bw-w[role="button"]{display:inline-flex;align-items:center;gap:6px;width:max-content;max-width:100%;cursor:pointer;border-radius:5px}
        .bw-item .bw-w[role="button"]:hover{color:var(--primary);text-decoration:underline}
        .bw-sound{font-size:12px;opacity:.45;transition:opacity .2s}
        .bw-item .bw-w[role="button"]:hover .bw-sound{opacity:1}
        .bw-item .bw-d{font-size:12px;color:#999;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .cb{position:fixed;top:14px;right:20px;z-index:210;pointer-events:auto}
        .loading{text-align:center;padding:40px;color:#999;font-size:16px}
        @media(max-width:768px){
            .sidebar{transform:translateX(-100%);width:280px}
            .sidebar.open{transform:translateX(0)}
            .menu-toggle{display:block}
            #main-screen{margin-left:0}
            .word-line{font-size:44px}
            .def-item{font-size:19px}
            #sr{left:50%;transform:translateX(-50%)}
            .nav-btns{bottom:100px}
            .nav-btn{width:48px;height:48px;font-size:18px}
        }
    </style>

<div id="bv"><div class="cb"><div class="pill" onclick="toggleBrowse()">✕</div></div><div id="browse-toolbar"><div class="browse-toolbar-title">📚 全部单词 · 分类浏览</div><div class="browse-toolbar-actions"><button type="button" onclick="setBrowseGroupsCollapsed(true)">全部折叠</button><button type="button" onclick="setBrowseGroupsCollapsed(false)">全部展开</button></div></div><div id="bc"></div></div>
<script src="english_data.js"></script>
<script>

const GMAP={'必考词':'bk','基础词':'jc','简单基础词':'jd','超纲词':'cg'};

let S=JSON.parse(localStorage.getItem('ws'))||{v:'all',g:'必考词',u:'all',s:'seq',ff:'all'};
let PM=JSON.parse(localStorage.getItem('wp'))||{};
let FV=JSON.parse(localStorage.getItem('wf'))||{};
let RQ=JSON.parse(localStorage.getItem('wr'))||{};
let Q=[],C=0,bOpen=false,sIdx=null;

const AC=new(window.AudioContext||window.webkitAudioContext)();
const NS=[261.63,293.66,329.63,349.23,392,440,493.88,523.25];
let ni=0;
function playN(d){const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=NS[((ni%NS.length)+NS.length)%NS.length];o.type='sine';g.gain.setValueAtTime(.1,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.2);o.start();o.stop(AC.currentTime+.2);ni+=d}

function getWords(){
    const gd=WD[S.g];
    if(!gd)return[];
    if(S.u==='all')return Object.entries(gd).flatMap(([p,ws])=>ws.map(w=>({w:w[0],d:w[1],p})));
    const ud=gd[S.u];if(!ud)return[];
    return ud.map(w=>({w:w[0],d:w[1],p:S.u}));
}

function buildQ(fr=false){
    let base,key=S.v+'_'+S.g+'_'+S.u+'_'+S.s;
    if(S.v==='fav'){base=Object.values(FV);if(S.ff!=='all')base=base.filter(w=>w.p===S.ff)}
    else base=getWords();
    if(!base.length){Q=[];C=0;renderE();return}
    if(S.s==='rand'){
        if(fr||!RQ[key]||RQ[key].length!==base.length){RQ[key]=[...base].sort(()=>Math.random()-.5);localStorage.setItem('wr',JSON.stringify(RQ))}
        Q=RQ[key];
    }else Q=base;
    C=fr?0:(PM[key]||0);if(C>=Q.length)C=0;
    renderW();updateFUI();
}

// Browser-native pronunciation: type=1 British English, type=2 American English.
let pronunciationAudio=null;
let activeUtterance=null;
function stopPronunciation(){
    if(pronunciationAudio){pronunciationAudio.pause();pronunciationAudio=null;}
    if('speechSynthesis' in window){window.speechSynthesis.cancel();}
    activeUtterance=null;
}
function playPronunciation(type,event,wordOverride){
    if(event)event.stopPropagation();
    const word=wordOverride||(Q.length?Q[C]?.w:null);
    if(!word)return;
    const status=document.getElementById('pronunciation-status');
    const buttons=[document.getElementById('uk-audio'),document.getElementById('us-audio')];
    stopPronunciation();
    buttons.forEach(b=>{if(b)b.disabled=true;});
    const accent=type===1?'en-GB':'en-US';
    status.textContent=type===1?'正在播放英式发音…':'正在播放美式发音…';
    const finish=()=>{buttons.forEach(b=>{if(b)b.disabled=false;});};
    if('speechSynthesis' in window && 'SpeechSynthesisUtterance' in window){
        const utterance=new SpeechSynthesisUtterance(String(word));
        utterance.lang=accent;
        utterance.rate=0.86;
        const voices=window.speechSynthesis.getVoices();
        const voice=voices.find(v=>v.lang.toLowerCase()===accent.toLowerCase())
          ||voices.find(v=>v.lang.toLowerCase().startsWith(type===1?'en-gb':'en-us'))
          ||voices.find(v=>v.lang.toLowerCase().startsWith('en'));
        if(voice)utterance.voice=voice;
        utterance.onend=()=>{if(activeUtterance===utterance){activeUtterance=null;status.textContent='';finish();}};
        utterance.onerror=()=>{if(activeUtterance===utterance){activeUtterance=null;status.textContent='系统语音不可用，正在尝试在线发音…';playRemotePronunciation(word,type,status,finish);}};
        activeUtterance=utterance;
        try{window.speechSynthesis.speak(utterance);return;}
        catch(error){activeUtterance=null;}
    }
    playRemotePronunciation(word,type,status,finish);
}
function playRemotePronunciation(word,type,status,finish){
    const audio=new Audio('https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(word)+'&type='+type);
    pronunciationAudio=audio;
    audio.onended=()=>{if(pronunciationAudio===audio)pronunciationAudio=null;status.textContent='';finish();};
    audio.onerror=()=>{if(pronunciationAudio===audio)pronunciationAudio=null;status.textContent='发音暂不可用，请检查浏览器语音设置或网络';finish();};
    audio.play().catch(()=>{if(pronunciationAudio===audio)pronunciationAudio=null;status.textContent='浏览器未能播放音频，请再次点击';finish();});
}
function speakCurrentWord(event){playPronunciation(2,event);}
function speakBrowseWord(word,event){playPronunciation(2,event,word);}
function renderW(){
    if(!Q.length)return;
    const w=Q[C];
    document.getElementById('dw').innerText=w.w;
    const audioButtons=[document.getElementById('uk-audio'),document.getElementById('us-audio')];
    audioButtons.forEach(b=>b.disabled=false);
    document.getElementById('pronunciation-status').textContent='';
    stopPronunciation();
    document.getElementById('dd').innerHTML=w.d.split(/[;；]/).map(d=>'<div class="def-item">'+d.trim()+'</div>').join('');
    document.getElementById('dp').innerText=w.p?'📖 '+w.p:'';
    document.getElementById('fav-btn').className=FV[w.w]?'active':'';
    document.getElementById('progress').innerText=(C+1)+'/'+Q.length;
    document.getElementById('prev-btn').disabled=C===0;
    document.getElementById('next-btn').disabled=C>=Q.length-1;
    PM[S.v+'_'+S.g+'_'+S.u+'_'+S.s]=C;
    localStorage.setItem('wp',JSON.stringify(PM));
}
function renderE(){document.getElementById('dw').innerText='暂无词汇';document.getElementById('dd').innerHTML='<div class="def-item">请选择分类</div>';document.getElementById('dp').innerText='';document.getElementById('progress').innerText='0/0'}

function toggleSection(titleEl){titleEl.parentElement.classList.toggle('collapsed')}

function goNext(){if(C<Q.length-1){C++;playN(1);renderW()}}

function goPrev(){if(C>0){C--;playN(-1);renderW()}}

function setMode(m){S.s=m;save();document.getElementById('m-seq').classList.toggle('active',m==='seq');document.getElementById('m-rand').classList.toggle('active',m==='rand');document.getElementById('m-reset').innerText=m==='rand'?'重洗':'重置';buildQ()}

function setGroup(g){S.g=g;S.u='all';save();document.querySelectorAll('#gs .pill').forEach(e=>e.classList.remove('active'));document.getElementById('g-'+GMAP[g]).classList.add('active');updateUS();buildQ()}

function setUnit(u){S.u=u;save();document.querySelectorAll('#up .pill').forEach(e=>e.classList.remove('active-sub'));const id='u_'+u.replace(/[^a-zA-Z0-9]/g,'_');const b=document.getElementById(id);if(b)b.classList.add('active-sub');buildQ()}

function updateUS(){
    document.getElementById('us').style.display='';
    const cd=CI[S.g];let h='<div class="pill active-sub" onclick="setUnit(&apos;all&apos;)">全部</div>';
    for(const p in cd){const id='u_'+p.replace(/[^a-zA-Z0-9]/g,'_');const s=p.replace(S.g,'')||p;h+='<div class="pill" id="'+id+'" onclick="setUnit(&apos;'+p.replace(/'/g,"&apos;")+'&apos;)">'+s+'('+cd[p]+')</div>'}
    document.getElementById('up').innerHTML=h;
}

function setView(v){S.v=v;save();document.getElementById('v-all').classList.toggle('active',v==='all');document.getElementById('v-fav').classList.toggle('active',v==='fav');document.getElementById('gs').style.display=v==='all'?'':'none';document.getElementById('us').style.display=v==='all'?'':'none';document.getElementById('fs').style.display=v==='fav'?'':'none';buildQ()}

function save(){localStorage.setItem('ws',JSON.stringify(S))}

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebar-overlay').classList.toggle('show')}

function toggleFav(e){e.stopPropagation();if(!Q.length)return;const w=Q[C];FV[w.w]?delete FV[w.w]:FV[w.w]=w;localStorage.setItem('wf',JSON.stringify(FV));document.getElementById('fav-btn').className=FV[w.w]?'active':''}

function updateFUI(){if(S.v!=='fav')return;const srcs=new Set(Object.values(FV).map(w=>w.p));let h='<div class="pill '+(S.ff==='all'?'active-sub':'')+'" onclick="setFF(&apos;all&apos;)">全部</div>';for(const s of srcs)h+='<div class="pill '+(S.ff===s?'active-sub':'')+'" onclick="setFF(&apos;'+s.replace(/'/g,"&apos;")+'&apos;)">'+s+'</div>';document.getElementById('ff').innerHTML=h}
function setFF(f){S.ff=f;save();buildQ()}
function resetQ(){buildQ(true)}

// Search
function ensureSI(){if(sIdx)return;sIdx=[];for(const[g,cd]of(Object.entries(WD)))for(const[p,ws]of(Object.entries(cd)))for(const w of ws)sIdx.push({w:w[0],d:w[1],p})}
function doSearch(q){const r=document.getElementById('sr');if(!q.trim()){r.classList.remove('show');return}ensureSI();const ql=q.toLowerCase().trim();const m=sIdx.filter(w=>w.w.toLowerCase().includes(ql)||w.d.toLowerCase().includes(ql)).slice(0,30);if(!m.length){r.innerHTML='<div class="loading">🔍 无匹配</div>'}else{r.innerHTML=m.map(w=>'<div class="si" onclick="goW(&apos;'+w.w.replace(/'/g,"&apos;")+'&apos;,&apos;'+w.p.replace(/'/g,"&apos;")+'&apos;)"><div class="si-w">'+w.w+'</div><div class="si-d">'+w.d+'</div><div class="si-p">'+w.p+'</div></div>').join('')}r.classList.add('show')}
function hideSR(){document.getElementById('sr').classList.remove('show')}

async function goW(word,page){
    hideSR();document.getElementById('si').value='';
    let group='必考词';for(const g of Object.keys(CI))if(page.startsWith(g)||page===g){group=g;break}
    S.v='all';S.g=group;S.u=page;S.s='seq';save();
    document.getElementById('v-all').classList.add('active');document.getElementById('v-fav').classList.remove('active');
    document.getElementById('gs').style.display='';
    document.querySelectorAll('#gs .pill').forEach(e=>e.classList.remove('active'));
    document.getElementById('g-'+GMAP[group]).classList.add('active');
    document.getElementById('m-seq').classList.add('active');document.getElementById('m-rand').classList.remove('active');
    updateUS();buildQ();
    const idx=Q.findIndex(w=>w.w===word);if(idx>=0){C=idx;renderW()}
    if(window.innerWidth<=768){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebar-overlay').classList.remove('show')}
}

// Browse
function toggleBrowse(){bOpen=!bOpen;document.getElementById('bv').classList.toggle('show',bOpen);if(bOpen)renderB()}
function setBrowseGroupsCollapsed(collapsed){
    document.querySelectorAll('#bc .bg').forEach(group=>{
        const title=group.querySelector('.bgt');
        const grid=group.querySelector('.bw-grid');
        if(title)title.classList.toggle('hid',collapsed);
        if(grid)grid.classList.toggle('hid',collapsed);
    });
}
function renderB(){
    let h='';
    for(const[g,cd]of(Object.entries(WD))){
        for(const[p,ws]of(Object.entries(cd))){
            h+='<div class="bg"><div class="bgt hid" onclick="this.classList.toggle(\'hid\');this.nextElementSibling.classList.toggle(\'hid\')"><span>'+p+' <span class="ct">('+ws.length+'词)</span></span><span class="ar">▼</span></div><div class="bw-grid hid">'+ws.map(w=>'<div class="bw-item" onclick="goW(&apos;'+w[0].replace(/'/g,"&apos;")+'&apos;,&apos;'+p.replace(/'/g,"&apos;")+'&apos;)"><div class="bw-w" role="button" tabindex="0" title="点击单词播放发音" onclick="speakBrowseWord(&apos;'+w[0].replace(/'/g,"&apos;")+'&apos;,event)" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();speakBrowseWord(&apos;'+w[0].replace(/'/g,"&apos;")+'&apos;,event)}">'+w[0]+' <span class="bw-sound" aria-hidden="true">🔊</span></div><div class="bw-d">'+w[1]+'</div></div>').join('')+'</div></div>'
        }
    }
    document.getElementById('bc').innerHTML=h;
}

// Init
window.onload=function(){
    document.getElementById('m-seq').classList.toggle('active',S.s==='seq');
    document.getElementById('m-rand').classList.toggle('active',S.s==='rand');
    document.getElementById('v-all').classList.toggle('active',S.v==='all');
    document.getElementById('v-fav').classList.toggle('active',S.v==='fav');
    document.getElementById('gs').style.display=S.v==='all'?'':'none';
    document.getElementById('us').style.display=S.v==='all'?'':'none';
    document.getElementById('fs').style.display=S.v==='fav'?'':'none';
    document.querySelectorAll('#gs .pill').forEach(e=>e.classList.remove('active'));
    const gb=document.getElementById('g-'+GMAP[S.g]);if(gb)gb.classList.add('active');
    if(S.g)updateUS();
    buildQ();
    document.addEventListener('keydown',function(e){
        if(e.key==='Escape'){var sb=document.getElementById('sidebar');if(sb.classList.contains('open')){sb.classList.remove('open');document.getElementById('sidebar-overlay').classList.remove('show')}}
        if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();goNext()}
        if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();goPrev()}
    });
};
</script>

<script id="word-enrichment-engine">
(function(){
 let activeWord='',requestToken=0,loaded=new Set();
 const root=()=>document.getElementById('word-enrichment');
 const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function shell(word){const el=root();if(!el)return;el.innerHTML='<div class="enrich-shell"><div class="enrich-head"><div><div class="enrich-title">📚 词汇拓展 · 词组、搭配与双语例句</div><div class="enrich-subtitle">围绕 <b>'+safe(word)+'</b> 补充常见表达、真实语境与中文翻译</div></div><button class="enrich-load" id="load-enrich-btn" type="button">加载词组与例句 ↗</button></div><div id="enrich-content"><div class="enrich-note">点击加载，按需查询在线词典；原始考研词库释义始终保留。</div></div></div>';document.getElementById('load-enrich-btn').onclick=()=>load(word,true);}
 function textOf(x){if(typeof x==='string')return x;if(Array.isArray(x))return x.map(textOf).filter(Boolean).join('；');if(x&&typeof x==='object')return x.i||x.text||x.value||x.content||'';return '';}
 function collectPhrases(data){
   const out=[],seen=new Set();
   function clean(v){return textOf(v).replace(/<[^>]*>/g,'').trim();}
   function translationOf(v){
     const found=[];
     function scan(x){if(!x||typeof x!=='object')return;if(Array.isArray(x)){x.forEach(scan);return;}
       const value=x.l?.i||x.i||x.translation||x.trans;
       if(typeof value==='string'&&value.trim())found.push(value.trim());
       Object.keys(x).forEach(k=>{if(k!=='l'&&k!=='i'&&k!=='translation'&&k!=='trans')scan(x[k]);});
     }
     scan(v);return [...new Set(found)].slice(0,2).join('；');
   }
   function walk(o){
     if(!o||typeof o!=='object')return;
     if(Array.isArray(o)){o.forEach(walk);return;}
     const en=clean(o.head||o.headword||o.phrase||o.phr||'');
     if(en&&en.length<100&&(o.trs||o.tr||o.translation)&&!seen.has(en.toLowerCase())){
       seen.add(en.toLowerCase());out.push({en,zh:translationOf(o.trs||o.tr||o.translation)});
     }
     Object.values(o).forEach(walk);
   }
   walk(data);return out.slice(0,12);
 }
 function collectSentences(data){
   const out=[],seen=new Set();
   function walk(o){if(!o||typeof o!=='object')return;if(Array.isArray(o)){o.forEach(walk);return;}
     const en=o.sentence||o.sentenceEng||o.source||o.src||o.orig;
     const zh=o['sentence-translation']||o.sentenceTranslation||o.translation||o.trans||o.target||o.tgt;
     if(typeof en==='string'&&en.length>12&&en.length<350){const k=en.toLowerCase();if(!seen.has(k)){seen.add(k);out.push({en,zh:typeof zh==='string'?zh:''});}}
     Object.values(o).forEach(walk);
   }
   walk(data);return out.slice(0,8);
 }
 function renderResult(word,phrases,sentences,extra){
   const el=document.getElementById('enrich-content');if(!el)return;
   let html='';
   if(phrases.length)html+='<div class="enrich-section"><h3>常见词组与固定搭配</h3><div class="enrich-tags">'+phrases.map(p=>'<span class="enrich-tag"><b>'+safe(p.en)+'</b>'+(p.zh?'<br><span class="enrich-zh">'+safe(p.zh)+'</span>':'')+'</span>').join('')+'</div></div>';
   if(sentences.length)html+='<div class="enrich-section"><h3>双语短句 · 在语境中理解单词</h3>'+sentences.map(s=>'<div class="enrich-sentence"><div class="enrich-en">'+safe(s.en)+'</div>'+(s.zh?'<div class="enrich-zh">'+safe(s.zh)+'</div>':'<div class="enrich-zh">暂未取得该例句的中文翻译</div>')+'</div>').join('')+'</div>';
   if(extra.length)html+='<div class="enrich-section"><h3>补充英文释义</h3>'+extra.map(x=>'<div class="enrich-tag">'+safe(x)+'</div>').join('')+'</div>';
   if(!html)html='<div class="enrich-error">在线词典暂未返回该词的词组或例句。你仍可使用上方原始中文释义和拼写练习。</div>';
   html+='<div class="enrich-note">在线补充内容来自第三方词典接口，网络或接口不可用时不会影响本地词库与背诵功能；例句翻译缺失时会明确标注，不自动编造。</div>';
   el.innerHTML=html;
 }
 async function load(word,force){
   const token=++requestToken,btn=document.getElementById('load-enrich-btn'),content=document.getElementById('enrich-content');
   if(!force&&loaded.has(word))return;
   if(btn){btn.disabled=true;btn.textContent='正在查询…';}
   if(content)content.innerHTML='<div class="enrich-note">正在查询词组、双语例句与补充释义…</div>';
   try{
     const url='https://dict.youdao.com/jsonapi?doctype=json&jsonversion=2&client=web&q='+encodeURIComponent(word);
     const response=await fetch(url,{mode:'cors',credentials:'omit'});
     if(!response.ok)throw new Error('词典服务暂不可用（HTTP '+response.status+'）');
     const data=await response.json();
     if(token!==requestToken)return;
     const phrases=collectPhrases(data);
     const sentences=collectSentences(data);
     const extra=[];
     const ec=data.ec?.word?.[0]?.trs||data.ec?.word?.trs||[];
     ec.forEach(t=>{(t.tr||[]).forEach(x=>{const s=textOf(x.l?.i||x.i);if(s)extra.push(s);});});
     renderResult(word,phrases,sentences,extra.slice(0,6));loaded.add(word);
   }catch(err){
     if(token!==requestToken)return;
     if(content)content.innerHTML='<div class="enrich-error">暂时无法连接在线词典：'+safe(err.message||'网络请求失败')+'。请检查网络后重试。</div><button class="enrich-load" id="retry-enrich-btn" type="button">重新加载</button>';
     const retry=document.getElementById('retry-enrich-btn');if(retry)retry.onclick=()=>load(word,true);
   }finally{if(token===requestToken&&btn){btn.disabled=false;btn.textContent='重新查询 ↻';}}
 }
 window.loadWordEnrichment=function(word){if(!word)return;activeWord=word;requestToken++;shell(word);};
 const base=window.renderW;
 if(typeof base==='function')window.renderW=function(){base();const w=Array.isArray(Q)&&Q.length?Q[C]:null;if(w)window.loadWordEnrichment(w.w);};
})();
</script>

<script id="study-card-engine">
(function(){
  'use strict';
  let studyMode='card', cardRevealed=false, choices=[];
  let stats={};
  try{stats=JSON.parse(localStorage.getItem('englishStudyStats')||'{}')||{};}catch(e){stats={};}
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function current(){return Array.isArray(Q)&&Q.length?Q[C]:null;}
  function meanings(w){return String(w&&w.d||'暂无中文释义').split(/[;；]/).map(s=>s.trim()).filter(Boolean);}
  function saveStats(){try{localStorage.setItem('englishStudyStats',JSON.stringify(stats));}catch(e){}}
  function record(word,ok){
    const x=stats[word]||{attempts:0,correct:0,status:'review'};
    x.attempts++;if(ok)x.correct++;x.last=ok?'correct':'wrong';x.updated=Date.now();stats[word]=x;saveStats();
  }
  function statsHtml(){
    const values=Object.values(stats);
    const known=values.filter(x=>x.status==='known').length;
    const review=values.filter(x=>x.status==='review').length;
    const wrong=values.filter(x=>x.last==='wrong').length;
    return '<div class="study-stats">累计练习 '+values.length+' 词 · 已掌握 '+known+' · 待复习 '+review+' · 最近答错 '+wrong+'</div>';
  }
  function render(){
    const panel=$('study-panel'),w=current();
    if(!panel)return;
    if(!w){panel.innerHTML='<div class="study-card-face">当前分类暂无单词，请切换词库分类。</div>';return;}
    const defs=meanings(w);
    const meaning='<ol>'+defs.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>';
    document.body.classList.toggle('study-mode-spell',studyMode==='spell');
    document.body.classList.toggle('study-mode-quiz',studyMode==='quiz');
    document.body.classList.toggle('study-card-revealed',studyMode==='card'&&cardRevealed);
    document.querySelectorAll('.study-mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===studyMode));
    if(studyMode==='card'){
      panel.innerHTML='<div class="study-card-face"><div class="study-eyebrow">'+(cardRevealed?'WORD MEANING · 中文释义':'ACTIVE RECALL · 主动回忆')+'</div>'+
        (cardRevealed?'<div class="study-meaning">'+meaning+'</div>':'<div class="study-meaning">先回忆这个单词的中文含义、词性和常见用法，再翻开卡片核对。</div>')+
        '<div class="study-actions"><button type="button" class="study-action" id="flip-card-btn">'+(cardRevealed?'收起释义':'翻开卡片 · 查看释义')+'</button><button type="button" class="study-action secondary" id="card-audio-btn">🔊 听发音</button></div>'+
        (cardRevealed?'<div class="study-actions"><button type="button" class="study-action" data-status="known">✓ 已掌握</button><button type="button" class="study-action secondary" data-status="review">↻ 加入复习</button></div>':'')+'</div>'+statsHtml();
      $('flip-card-btn').onclick=()=>{cardRevealed=!cardRevealed;render();};
      $('card-audio-btn').onclick=e=>{if(window.playPronunciation)window.playPronunciation(2,e);};
      panel.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{const x=stats[w.w]||{attempts:0,correct:0};x.status=b.dataset.status;stats[w.w]=x;saveStats();render();});
    }else if(studyMode==='spell'){
      panel.innerHTML='<div class="spell-prompt"><div class="study-eyebrow">SPELLING PRACTICE · 根据中文释义拼写</div><div class="study-meaning">'+meaning+'</div><div class="study-hint">输入完整英文单词；不区分大小写。</div></div>'+
        '<input id="spell-answer" class="spell-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入英文单词…">'+
        '<div class="study-actions"><button type="button" class="study-action" id="spell-check-btn">检查拼写</button><button type="button" class="study-action secondary" id="spell-clear-btn">清空重试</button><button type="button" class="study-action secondary" id="spell-show-btn">显示答案</button></div><div id="spell-feedback" class="spell-feedback" aria-live="polite"></div>'+statsHtml();
      const input=$('spell-answer');
      $('spell-check-btn').onclick=checkSpelling;
      $('spell-clear-btn').onclick=()=>{input.disabled=false;input.value='';$('spell-feedback').textContent='';$('spell-feedback').className='spell-feedback';input.focus();};
      $('spell-show-btn').onclick=()=>{$('spell-feedback').className='spell-feedback';$('spell-feedback').innerHTML='参考拼写：<strong>'+esc(w.w)+'</strong>';};
      input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();checkSpelling();}};
    }else{
      const pool=(Array.isArray(Q)?Q:[]).filter(x=>x&&x.w!==w.w);
      const seen=new Set([w.w.toLowerCase()]);
      const distractors=[];
      for(const item of pool.sort(()=>Math.random()-.5)){
        const key=String(item.w).toLowerCase();
        if(!seen.has(key)){seen.add(key);distractors.push(item);if(distractors.length===3)break;}
      }
      choices=[w,...distractors].sort(()=>Math.random()-.5);
      panel.innerHTML='<div class="quiz-prompt"><div class="study-eyebrow">MEANING CHECK · 根据中文释义选择单词</div><div class="study-meaning">'+meaning+'</div><div class="study-hint">选择与以上释义对应的英文单词。</div></div><div class="quiz-options">'+choices.map((x,i)=>'<button type="button" class="quiz-option" data-choice="'+i+'">'+esc(x.w)+'</button>').join('')+'</div><div id="quiz-feedback" class="spell-feedback" aria-live="polite"></div>'+statsHtml();
      panel.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>chooseMeaning(Number(b.dataset.choice)));
    }
  }
  function checkSpelling(){
    const w=current(),input=$('spell-answer'),feedback=$('spell-feedback');
    if(!w||!input||!feedback)return;
    const answer=input.value.trim().toLowerCase(),expected=String(w.w).trim().toLowerCase();
    if(!answer){feedback.className='spell-feedback bad';feedback.textContent='请先输入单词再检查。';input.focus();return;}
    const ok=answer===expected;record(w.w,ok);
    if(ok){feedback.className='spell-feedback good';feedback.textContent='✓ 拼写正确！做得好。';input.disabled=true;}
    else{
      let i=0;while(i<Math.min(answer.length,expected.length)&&answer[i]===expected[i])i++;
      const mask=expected.split('').map((ch,n)=>n<i?ch:'_').join(' ');
      feedback.className='spell-feedback bad';
      feedback.innerHTML='✕ 还不正确。已正确匹配 '+i+' 个开头字母。<div class="spell-masked">'+esc(mask)+'</div><div>正确拼写：<strong>'+esc(w.w)+'</strong></div>';
    }
    const old=$('study-stats');if(old)old.outerHTML=statsHtml();
  }
  function chooseMeaning(index){
    const w=current(),selected=choices[index];if(!w||!selected)return;
    const ok=selected.w===w.w;record(w.w,ok);
    document.querySelectorAll('.quiz-option').forEach((b,i)=>{
      b.disabled=true;
      if(choices[i].w===w.w)b.classList.add('correct');
      else if(i===index)b.classList.add('wrong');
    });
    const feedback=$('quiz-feedback');
    if(feedback)feedback.textContent=ok?'✓ 回答正确！':'✕ 正确答案：'+w.w+'。释义：'+meanings(w).join('；');
    const old=$('study-stats');if(old)old.outerHTML=statsHtml();
  }
  window.setStudyMode=function(mode){
    if(!['card','spell','quiz'].includes(mode))return;
    studyMode=mode;cardRevealed=false;render();
  };
  window.flipStudyCard=function(){cardRevealed=!cardRevealed;render();};
  window.markStudyStatus=function(status){const w=current();if(!w)return;const x=stats[w.w]||{attempts:0,correct:0};x.status=status;stats[w.w]=x;saveStats();render();};
  const baseRenderW=window.renderW;
  if(typeof baseRenderW==='function'){
    window.renderW=function(){baseRenderW();cardRevealed=false;render();};
  }
  window.addEventListener('load',render);
  window.addEventListener('storage',e=>{if(e.key==='englishStudyStats'){try{stats=JSON.parse(e.newValue||'{}')||{};}catch(_){stats={};}render();}});
  window.englishStudySmokeTest=function(){
    const w=current();return {hasWord:!!w,word:w?.w||null,meaningCount:w?meanings(w).length:0,modes:['card','spell','quiz'].map(mode=>{studyMode=mode;render();return {mode,rendered:!!$('study-panel')?.textContent?.trim()};})};
  };
})();
</script>

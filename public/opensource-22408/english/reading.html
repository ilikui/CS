<header><a href="./mindmap.html">← 返回词汇思维网络</a>　<a href="./review.html" style="font-weight:700">🧠 统一间隔复习 ↗</a><h1>📚 英语二真题阅读地图</h1><p>按年份与篇章聚合英语二词汇出处，建立“主题词群 → 真题年份 → Text 篇章 → 词汇复习”的路径。这里展示的是词条出处索引，不是阅读原文；点击单词可回到词汇网络查看释义、短语、熟词僻义和关联长难句。</p></header>

<script>
(async function(){
const files=['english2_exam_index_01a.json','english2_exam_index_01b.json','english2_exam_index_02.json','english2_exam_index_03.json','english2_exam_index_04.json'];
const $=id=>document.getElementById(id),localDateKey=(d=new Date())=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let words={},groups=new Map(),selected=null;
const topicThemes=[
{id:'education',keys:['教育','学习','教学','学校','学生','教师','课程','知识','阅读','考试','大学','研究','培训','课堂','学术','学者','学习者']},
{id:'technology',keys:['科学','技术','科技','数据','计算机','网络','人工智能','机器','数字','信息','实验','设备','创新','算法','电子','自动化','机器人','软件','互联网']},
{id:'economy',keys:['经济','金融','市场','贸易','商业','价格','成本','收入','消费','生产','企业','公司','资本','投资','产业','资源','贫困','财富','就业','工资','税收']},
{id:'society',keys:['社会','社区','公共','人口','群体','家庭','工作','就业','城市','人类','民众','居民','关系','移民','劳动','职业','福利','健康']},
{id:'environment',keys:['环境','污染','气候','生态','能源','自然','野生','森林','海洋','水资源','空气','可持续','保护','物种','生物','动物','植物','全球变暖','碳排放']},
{id:'psychology',keys:['心理','认知','情绪','感情','思维','记忆','注意','意识','行为','动机','态度','压力','焦虑','人格','感知','判断','决策','心理学','情感','信念','偏见']},
{id:'politics',keys:['政治','政府','国家','政策','法律','权利','民主','选举','议会','官员','文化','艺术','历史','传统','价值观','信仰','宗教','制度','公民']}
];
const wordDefs=new Map();
try{Object.values(WD||{}).forEach(units=>Object.values(units||{}).forEach(rows=>(rows||[]).forEach(row=>{if(row?.[0])wordDefs.set(String(row[0]).toLowerCase(),String(row[1]||''));})));}catch(_){}
function themesFor(word){const d=(wordDefs.get(word.toLowerCase())||'').toLowerCase();return topicThemes.filter(t=>t.keys.some(k=>d.includes(k))).map(t=>t.id);}
function parseSource(src){
 const y=(src.match(/(20\d{2})年/)||[])[1];if(!y)return null;
 const parts=src.split(/\s*➫\s*/).map(x=>x.trim());
 const sec=parts.find(x=>/^Section\s/i.test(x))||'其他题型';
 const text=parts.find(x=>/^Text\s*\d+/i.test(x));
 const part=parts.find(x=>/^Part\s/i.test(x));
 const title=[sec,part,text].filter(Boolean).join(' · ')||parts.slice(1,3).join(' · ')||'未细分定位';
 const key=y+'|'+title;
 return {key,year:y,section:sec,part:part||'',text:text||'',title,source:src};
}
try{
 const [shards,enrichmentData,polysemyData,longSentenceData]=await Promise.all([
 Promise.all(files.map(async f=>{const r=await fetch('./'+f);if(!r.ok)throw Error('加载失败：'+f);return r.json()})),
 fetch('./english_enrichment_data.json').then(r=>{if(!r.ok)throw Error('拓展短语数据加载失败');return r.json()}),
 fetch('./english2_polysemy_data.json').then(r=>{if(!r.ok)throw Error('熟词僻义数据加载失败');return r.json()}),
 fetch('./english2_long_sentence_data.json').then(r=>{if(!r.ok)throw Error('长难句数据加载失败');return r.json()})
 ]);
 const enrichment=enrichmentData.entries||{},polysemy=polysemyData.entries||{},longSentences=longSentenceData.items||[];
 shards.forEach(shard=>Object.entries(shard.words||{}).forEach(([w,m])=>{
  const old=words[w]||{word:w,definition:wordDefs.get(w.toLowerCase())||'',exampleCount:0,sources:new Set()};
  old.exampleCount=Math.max(old.exampleCount,m.exampleCount||0);(m.sources||[]).forEach(src=>old.sources.add(src));words[w]=old;
 }));
 Object.values(words).forEach(w=>w.sources.forEach(src=>{const p=parseSource(src);if(!p)return;let g=groups.get(p.key);if(!g){g={...p,words:new Map(),sources:new Set()};groups.set(p.key,g)}g.words.set(w.word,{...w});g.sources.add(src)}));
 const years=[...new Set([...groups.values()].map(x=>x.year))].sort((a,b)=>b-a);
 const sections=[...new Set([...groups.values()].map(x=>x.section))].sort();
 $('wordCount').textContent=Object.keys(words).length.toLocaleString();$('passageCount').textContent=groups.size.toLocaleString();$('yearCount').textContent=years.length;
 years.forEach(y=>$('year').add(new Option(y+' 年',y)));
 sections.forEach(s=>$('section').add(new Option(s,s)));
 $('years').innerHTML=years.map(y=>'<button class="yearbtn" data-year="'+y+'">'+y+'</button>').join('');
 $('years').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('year').value=b.dataset.year;renderList()});
 function filtered(){const y=$('year').value,sec=$('section').value,theme=$('theme').value,status=$('reviewStatus').value,q=$('search').value.trim().toLowerCase();return [...groups.values()].filter(g=>{const p=getProgress(g.key);const due=p?.nextReviewAt&&p.nextReviewAt<=localDateKey();const statusOK=status==='all'||(status==='due'&&due)||(status==='completed'&&p?.completed)||(status==='pending'&&!p?.completed)||(status==='mastered'&&p?.mastered);return statusOK&&(y==='all'||g.year===y)&&(sec==='all'||g.section===sec)&&(theme==='all'||[...g.words.keys()].some(w=>themesFor(w).includes(theme)))&&(!q||(g.year+' '+g.title+' '+[...g.words.keys()].join(' ')).toLowerCase().includes(q))}).sort((a,b)=>b.year-a.year||a.title.localeCompare(b.title,'en'))}
 function getProgress(key){try{return JSON.parse(localStorage.getItem('cs-english-passage-progress-v1:'+key)||'null')}catch(_){return null}}
 function dateLabel(value){if(!value)return '尚未安排复习';const d=new Date(value+'T00:00:00');return Number.isNaN(d.getTime())?value:d.toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'})}
 function renderList(){const list=filtered();$('years').querySelectorAll('button').forEach(b=>b.classList.toggle('active',$('year').value===b.dataset.year));const completed=[...groups.keys()].filter(k=>getProgress(k)?.completed).length;const due=[...groups.keys()].filter(k=>{const p=getProgress(k);return p?.nextReviewAt&&p.nextReviewAt<=localDateKey()}).length;$('detail').innerHTML='<div class="detail-head"><div><h2>真题篇章索引</h2><p class="muted">当前筛选 '+list.length+' 个出处定位。已完成精读 '+completed+' 篇 · 今日到期 '+due+' 篇。选择篇章查看关联词汇。</p></div></div><div class="list" id="passages">'+list.map(g=>{const p=getProgress(g.key);return '<button class="passage" data-key="'+esc(g.key)+'"><b>'+esc(g.year)+' 年 · '+esc(g.title)+(p?.completed?'　✓ 已精读':'')+'</b><small>'+g.words.size+' 个关联词条 · '+g.sources.size+' 条原始定位 · '+(p?.nextReviewAt?'下次复习 '+dateLabel(p.nextReviewAt):'未安排复习')+'</small></button>'}).join('')+'</div>'+(list.length?'':'<div class="empty">没有匹配的篇章定位。试试清空关键词或切换题型。</div>');$('detail').querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>renderDetail(groups.get(b.dataset.key)))}
 function renderDetail(g){
 selected=g.key;
 const vocab=[...g.words.values()].sort((a,b)=>b.sources.size-a.sources.size||a.word.localeCompare(b.word,'en'));
 const wordSet=new Set(vocab.map(w=>w.word.toLowerCase()));
 const phrases=[];
 vocab.forEach(w=>(enrichment[w.word.toLowerCase()]?.phrases||[]).forEach(p=>phrases.push({word:w.word,phrase:p[0],meaning:p[1]})));
 const polyRows=vocab.map(w=>({word:w.word,...(polysemy[w.word.toLowerCase()]||{})})).filter(x=>x.core||x.context);
 const themeCounts={};vocab.forEach(w=>themesFor(w.word).forEach(t=>themeCounts[t]=(themeCounts[t]||0)+1));
 const theme=Object.entries(themeCounts).sort((a,b)=>b[1]-a[1])[0]?.[0]||'';
 const longRows=longSentences.map(x=>({...x,overlap:(x.vocab||[]).filter(w=>wordSet.has(w.toLowerCase())).length})).filter(x=>x.overlap>0).sort((a,b)=>b.overlap-a.overlap).slice(0,3);
 const themeNames={education:'教育与学习',technology:'科技与创新',economy:'经济与商业',society:'社会与生活',environment:'环境与生态',psychology:'心理与认知',politics:'政治与文化'};
 const noteKey='cs-english-reading-note-v1:'+g.key;
 const wordRows=vocab.slice(0,12);
 $('detail').innerHTML=
 '<div class="detail-head"><div><h2>'+esc(g.year)+' 年 · '+esc(g.title)+'</h2><p class="muted">关联 '+g.words.size+' 个词条；按词条出处关联，不代表该篇章词频。</p></div><button id="backList">← 返回篇章列表</button></div><div class="study-actions"><button id="completePassage">✓ 标记精读完成</button><button id="reviewPassage">完成一次复习</button><button id="addUnifiedReview">＋ 加入统一复习</button><span class="muted" id="passageProgressLabel"></span></div>'+
 '<div><span class="tag">'+esc(g.section)+'</span>'+(g.part?'<span class="tag">'+esc(g.part)+'</span>':'')+(g.text?'<span class="tag">'+esc(g.text)+'</span>':'')+(theme?'<span class="tag">主题倾向：'+esc(themeNames[theme]||theme)+'</span>':'')+'</div>'+
 '<div class="wordgrid">'+vocab.map(w=>'<button class="word" data-word="'+esc(w.word)+'"><strong>'+esc(w.word)+'</strong><small>'+esc(w.definition||'暂无中文释义')+' · '+w.sources.size+' 条出处</small></button>').join('')+'</div>'+
 '<div class="source"><strong>原始出处定位</strong><br>'+[...g.sources].map(esc).join('<br>')+'</div>'+
 '<div class="study-grid">'+
 '<article class="study-card"><h3>🧭 本篇精读路线</h3><p>当前页面掌握的是该篇章的词汇出处索引，不含阅读原文。请打开你持有的真题资料，按下面步骤完成原文精读。</p><ol><li><b>预读（SQ3R）</b>：先看标题、首尾段和题干，预测文章议题。</li><li><b>结构（西蒙学习法）</b>：每段只提炼一个核心命题，标注转折、因果、举例和让步。</li><li><b>复述（费曼）</b>：合上原文，用三句话讲清作者问题、论证和结论。</li><li><b>复盘（康奈尔）</b>：左栏记关键词/疑问，右栏记证据与解释，底部写段落总结。</li><li><b>番茄节奏</b>：25 分钟精读 + 5 分钟闭卷回忆，错词进入复习队列。</li></ol><div class="study-actions"><span class="method">SQ3R</span><span class="method">西蒙</span><span class="method">费曼</span><span class="method">康奈尔</span><span class="method">番茄</span></div></article>'+
 '<article class="study-card"><h3>📝 段落结构记录模板</h3><p><b>第 1 段：</b>话题引入 / 背景 / 作者立场</p><p><b>第 2 段：</b>核心论点 / 解释 / 例证</p><p><b>第 3 段：</b>转折 / 争议 / 反方观点</p><p><b>第 4 段：</b>结论 / 建议 / 影响（按原文实际段落调整）</p><p class="muted">提示：不要机械套四段式；以原文段落数量和逻辑为准。</p></article>'+
 '<article class="study-card"><h3>🏗️ 全文结构识别训练</h3><p>围绕 <b>'+esc(g.year)+' 年 · '+esc(g.title)+'</b> 阅读原文，判断文章如何提出问题、展开论证和收束观点。不要只按段落顺序复述，要找作者的论证骨架。</p><ul><li><b>问题—分析—解决：</b>提出问题 → 分析成因/影响 → 对策或展望</li><li><b>观点—论据—结论：</b>中心主张 → 事实/研究/例子 → 推导结论</li><li><b>现象—解释：</b>描述现象 → 解释机制、原因或条件</li><li><b>对比—评价：</b>比较两种做法/观点 → 比较标准 → 作者判断</li><li><b>让步—反驳：</b>承认部分合理性 → 指出局限 → 强化作者立场</li><li><b>时间/过程：</b>按历史阶段、实验步骤或变化过程推进</li></ul><textarea id="structureAnalysis" placeholder="① 文章核心议题（一句话）：\n② 作者要回答的核心问题：\n③ 开头如何引入：\n④ 主体如何组织论据：\n⑤ 结尾如何收束：\n⑥ 结构类型及判断依据（至少两个段落/逻辑信号）："></textarea></article>'+
 '<article class="study-card"><h3>🧩 段落逻辑链训练</h3><p>每段都记录“讲什么、为什么放在这里、与前后段是什么关系”。识别主题句、解释、例证、转折、让步、因果、递进和结论。</p><p class="muted"><b>逻辑信号：</b>转折 however / yet / nevertheless；因果 because / therefore / thus；举例 for example / such as；让步 although / while / admittedly；递进 moreover / furthermore；总结 overall / in short。</p><textarea id="logicAnalysis" placeholder="按原文实际段落填写：\nP1：功能 → 核心命题 → 证据/例子 → 与主旨关系\nP2：承接/转折/解释/举例/反驳？信号词是什么？\nP3：与上一段是因果、对比、递进还是让步？\nP4…\n全文逻辑链：A（提出问题）→ B（解释/证据）→ C（转折/反驳）→ D（结论）\n最关键的逻辑转折及其作用："></textarea></article>'+
 '<article class="study-card"><h3>🎭 作者态度与语气识别</h3><p>先判断态度对象，再判断褒贬和强弱。区分作者立场、被引用者观点、反方观点与作者最终评价。</p><ul><li><b>积极：</b>支持、认可、赞赏；beneficial, promising, valuable</li><li><b>消极：</b>批评、担忧、质疑；problematic, flawed, harmful, concern</li><li><b>谨慎：</b>保留、有限认可；may, might, seem, suggest, to some extent</li><li><b>中立：</b>描述事实、解释机制，不急于评价</li><li><b>复杂：</b>承认收益，同时指出代价或局限</li><li><b>讽刺：</b>字面褒义与上下文评价不一致，需结合语境确认</li></ul><textarea id="attitudeAnalysis" placeholder="① 作者态度：积极 / 消极 / 谨慎 / 中立 / 复杂 / 讽刺\n② 态度对象：具体观点、政策、群体或现象\n③ 态度强度：强烈 / 明确 / 温和 / 保留\n④ 证据词/转折句及所在段落：\n⑤ 谁在表达：作者 / 引述者 / 反方？\n⑥ 为什么不是相邻的另一个态度选项？"></textarea></article>'+
 '<article class="study-card"><h3>🪤 选项干扰项诊断训练</h3><p>每个选项都回到原文证据核验。不能因为出现原文同义词就判正确；正确项还必须满足主体、范围、方向、因果和语气。</p><ul><li><b>偷换主体：</b>把作者、研究者、公众或群体混为一谈</li><li><b>范围扩大/缩小：</b>把 some / often 夸大为 all / always，或缩小整体结论</li><li><b>方向反转：</b>肯定/否定、原因/结果、支持/反对颠倒</li><li><b>因果错置：</b>把相关性当因果，或把结果说成原因</li><li><b>断章取义：</b>忽略后文转折、限制条件</li><li><b>无中生有：</b>原文没有提供依据</li><li><b>过度推断：</b>从有限证据推出绝对或更广泛结论</li><li><b>答非所问：</b>内容可能正确，却没有回答题干</li></ul><textarea id="distractorAnalysis" placeholder="题号 / 题型：\n题干真正询问的对象与任务：\n定位段落及证据：\nA：选项主张｜证据｜干扰类型｜排除理由\nB：选项主张｜证据｜干扰类型｜排除理由\nC：选项主张｜证据｜干扰类型｜排除理由\nD：选项主张｜证据｜干扰类型｜排除理由\n正确项：为何与原文同义且范围/语气一致？\n核验：主体、范围、方向、因果、语气是否一致？"></textarea></article>'+
 '<article class="study-card"><h3>🧱 逐段精读工作台</h3><p class="muted">按原文实际段落填写，不预设文章一定为四段。每段只记录“功能—主旨—证据—逻辑关系”。</p><div id="paragraphWorkbench"><div class="sentence-practice"><b>段落 1</b><input data-paragraph="1" placeholder="段落功能（背景 / 观点 / 例证 / 转折 / 结论）"><textarea data-paragraph-summary="1" placeholder="本段主旨、关键证据与逻辑关系"></textarea></div><div class="sentence-practice"><b>段落 2</b><input data-paragraph="2" placeholder="段落功能"><textarea data-paragraph-summary="2" placeholder="本段主旨、关键证据与逻辑关系"></textarea></div><div class="sentence-practice"><b>段落 3</b><input data-paragraph="3" placeholder="段落功能"><textarea data-paragraph-summary="3" placeholder="本段主旨、关键证据与逻辑关系"></textarea></div><div class="sentence-practice"><b>段落 4（可选）</b><input data-paragraph="4" placeholder="段落功能"><textarea data-paragraph-summary="4" placeholder="本段主旨、关键证据与逻辑关系"></textarea></div></div><p class="muted">阅读策略：先找段落主题句，再标记 however / therefore / for example / although 等逻辑信号，最后用自己的话压缩段意。</p></article><article class="study-card"><h3>🎯 题干定位与选项辨析</h3><p class="muted">对照你手中的真题题目填写；不虚构题干、选项或答案。</p><textarea id="questionStem" placeholder="题号与题干：\n题干关键词：\n定位段落 / 原文证据："></textarea><textarea id="optionAnalysis" placeholder="A：原文证据 / 错误原因\nB：原文证据 / 错误原因\nC：原文证据 / 错误原因\nD：原文证据 / 错误原因\n正确项：为什么正确？其他选项属于偷换概念、过度推断、张冠李戴还是无中生有？"></textarea><textarea id="wrongReview" placeholder="错题复盘：我被哪个干扰项迷惑？错因属于词义、句法、定位、推理还是作者态度？下次如何识别？"></textarea></article><article class="study-card"><h3>🕸️ 主题词群双向连接</h3><p>本篇词汇可回到词汇网络继续查看释义、短语与相关词；完成精读后，把文章主旨压缩成一个主题标签，并与其他年份同主题篇章对照。</p><div class="study-actions"><button type="button" id="openMindmap">打开词汇思维网络</button><button type="button" id="copyPassageIndex">复制本篇索引</button></div><p class="muted">跨篇比较建议：同一主题下比较作者立场、论证方式、常见搭配和熟词僻义，不把相似主题误当作相同观点。</p></article><article class="study-card"><h3>🔗 本篇关联短语</h3>'+(phrases.length?'<ul>'+phrases.slice(0,18).map(p=>'<li><b>'+esc(p.phrase)+'</b> — '+esc(p.meaning)+' <span class="muted">('+esc(p.word)+')</span></li>').join('')+'</ul>':'<p class="muted">当前篇章关联词暂未命中已整理的拓展短语，后续可按词条持续补充。</p>')+'</article>'+
 '<article class="study-card"><h3>🧩 熟词僻义 / 语境辨析</h3>'+(polyRows.length?polyRows.slice(0,10).map(p=>'<div class="sentence-practice"><b>'+esc(p.word)+' · '+esc(p.core||'核心义')+'</b><p>'+esc(p.context||'')+'</p><p class="muted">辨析：'+esc(p.note||'结合上下文判断词义。')+'</p><p class="muted">自编例句：'+esc(p.example||'')+' '+esc(p.translation||'')+'</p></div>').join(''):'<p class="muted">当前篇章暂未匹配到独立整理的熟词僻义条目。</p>')+'</article>'+
 '<article class="study-card"><h3>📖 长难句拆解练习</h3>'+(longRows.length?longRows.map((x,i)=>'<div class="sentence-practice"><b>'+esc(x.title)+' <span class="muted">自编仿真练习，非真题原句</span></b><p>'+esc(x.sentence)+'</p><button type="button" data-reveal="sentence-'+i+'">展开译文与结构</button><div class="answer" id="sentence-'+i+'" hidden><p><b>译文：</b>'+esc(x.translation)+'</p><p><b>结构：</b>'+esc(x.structure)+'</p><p><b>考点：</b>'+esc(x.focus)+'</p></div></div>').join(''):'<p class="muted">当前篇章词汇与已整理长难句没有直接交集。可先用下方词汇回忆练习。</p>')+'</article>'+
 '<article class="study-card"><h3>⚡ 闭卷主动回忆</h3><p class="muted">先看英文尝试说出中文义，再展开答案；这些词均来自当前篇章出处索引。</p>'+wordRows.map((w,i)=>'<div class="sentence-practice"><b>'+esc(w.word)+'</b><br><button type="button" data-reveal="word-'+i+'">显示释义</button><div class="answer" id="word-'+i+'" hidden>'+esc(w.definition||'请结合词典补充释义')+'</div></div>').join('')+'</article>'+
 '<article class="study-card"><h3>📓 我的康奈尔笔记</h3><p class="muted">记录主旨、段落逻辑、错题原因和待复习词。内容保存在当前浏览器。</p><textarea id="readingNote" placeholder="主旨：\n段落逻辑：\n作者态度：\n生词与熟词僻义：\n错题复盘："></textarea><div class="study-actions"><button id="saveNote">保存本篇笔记</button><span class="muted" id="noteStatus"></span></div></article>'+
 '</div><p class="muted" style="margin-top:14px">说明：短语来自词库人工拓展数据；熟词僻义和长难句示例为自编教学材料，已明确标注，不能当作该年份真题原句。真题原文请以授权资料为准。</p>';
 const progressKey='cs-english-passage-progress-v1:'+g.key;
 const progress=getProgress(g.key)||{completed:false,stage:0,nextReviewAt:null};
 const progressLabel=$('passageProgressLabel');
 const renderProgress=()=>{const p=getProgress(g.key)||progress;$('completePassage').textContent=p.completed?'✓ 已完成精读（点击重置）':'✓ 标记精读完成';progressLabel.textContent=p.nextReviewAt?'复习阶段 '+p.stage+'/4 · 下次复习 '+dateLabel(p.nextReviewAt):'尚未建立复习计划';};
 const saveProgress=p=>{try{localStorage.setItem(progressKey,JSON.stringify(p));renderProgress();}catch(_){progressLabel.textContent='浏览器存储不可用，无法保存进度';}};
 $('completePassage').onclick=()=>{const p=getProgress(g.key)||{stage:0};if(p.completed){saveProgress({completed:false,stage:0,nextReviewAt:null});}else{const next=new Date();next.setDate(next.getDate()+1);saveProgress({completed:true,stage:0,completedAt:new Date().toISOString(),nextReviewAt:localDateKey(next)});}};
 $('reviewPassage').onclick=()=>{const p=getProgress(g.key);if(!p?.completed){progressLabel.textContent='请先标记完成精读，再开始间隔复习';return;}const intervals=[1,3,7,14];const stage=Math.min((p.stage||0)+1,4);if(stage>=4){saveProgress({...p,stage:4,nextReviewAt:null,lastReviewedAt:new Date().toISOString(),mastered:true});progressLabel.textContent='已完成 1/3/7/14 天复习阶梯！';}else{const next=new Date();next.setDate(next.getDate()+intervals[stage]);saveProgress({...p,stage,lastReviewedAt:new Date().toISOString(),nextReviewAt:localDateKey(next)});}};
 renderProgress();
 const unifiedKey='cs-english-unified-review-v1',unifiedId='reading:'+g.key;
 const refreshUnifiedButton=()=>{try{const data=JSON.parse(localStorage.getItem(unifiedKey)||'{}');$('addUnifiedReview').textContent=data[unifiedId]?'✓ 已加入统一复习':'＋ 加入统一复习'}catch(_){$('addUnifiedReview').textContent='＋ 加入统一复习'}};
 refreshUnifiedButton();
 $('addUnifiedReview').onclick=()=>{try{const data=JSON.parse(localStorage.getItem(unifiedKey)||'{}');if(!data[unifiedId])data[unifiedId]={level:0,reps:0,lapses:0,due:Date.now(),source:'英语二真题出处索引'};localStorage.setItem(unifiedKey,JSON.stringify(data));refreshUnifiedButton();progressLabel.textContent='已加入统一复习队列，可在复习中心开始练习';}catch(_){progressLabel.textContent='浏览器存储不可用，无法加入统一复习'}};
 $('backList').onclick=renderList;
 $('detail').querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>window.open('./mindmap.html?word='+encodeURIComponent(b.dataset.word),'_blank','noopener'));
 $('detail').querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>{const panel=$(b.dataset.reveal);if(panel){panel.hidden=!panel.hidden;b.textContent=panel.hidden?(b.dataset.reveal.startsWith('word-')?'显示释义':'展开译文与结构'):'收起答案'}});
 const note=$('readingNote');
 const fields=['questionStem','optionAnalysis','wrongReview','structureAnalysis','logicAnalysis','attitudeAnalysis','distractorAnalysis'];
 const paragraphFields=[...$('detail').querySelectorAll('[data-paragraph],[data-paragraph-summary]')];
 const loadField=id=>{try{return localStorage.getItem(noteKey+':'+id)||''}catch(_){return ''}};
 const saveField=(id,value)=>{try{localStorage.setItem(noteKey+':'+id,value);return true}catch(_){return false}};
 try{note.value=loadField('cornell');fields.forEach(id=>{if($(id))$(id).value=loadField(id)});paragraphFields.forEach(el=>{const id=el.hasAttribute('data-paragraph')?'paragraph-'+el.dataset.paragraph:'summary-'+el.dataset.paragraphSummary;el.value=loadField(id)})}catch(_){}
 $('saveNote').onclick=()=>{let ok=saveField('cornell',note.value);fields.forEach(id=>{if($(id))ok=saveField(id,$(id).value)&&ok});paragraphFields.forEach(el=>{const id=el.hasAttribute('data-paragraph')?'paragraph-'+el.dataset.paragraph:'summary-'+el.dataset.paragraphSummary;ok=saveField(id,el.value)&&ok});$('noteStatus').textContent=ok?'本篇精读记录已保存在本机浏览器':'部分内容无法保存，请复制备份笔记。'};
 $('openMindmap').onclick=()=>window.open('./mindmap.html','_blank','noopener');
 $('copyPassageIndex').onclick=()=>{const text=g.year+' 年 · '+g.title+'\\n'+[...g.sources].join('\\n')+'\\n关联词汇：'+vocab.map(x=>x.word).join(', ');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>alert('本篇索引已复制')).catch(()=>alert('复制失败，请手动选择索引内容'));else alert(text)};
 }
 ['year','section','theme','reviewStatus'].forEach(id=>$(id).onchange=renderList);$('search').oninput=renderList;
// 学习数据备份：仅导出本页面命名空间，避免读取或覆盖其他站点数据。
const backupPrefixes=['cs-english-passage-progress-v1:','cs-english-reading-note-v1:'];
function collectStudyData(){const data={format:'cs-english-reading-backup',version:1,exportedAt:new Date().toISOString(),items:{}};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&backupPrefixes.some(p=>k.startsWith(p)))data.items[k]=localStorage.getItem(k)}return data}
$('exportStudyData').onclick=()=>{try{const data=collectStudyData();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='cs-english-reading-backup-'+localDateKey()+'.json';a.click();URL.revokeObjectURL(url);$('backupStatus').textContent='已导出 '+Object.keys(data.items).length+' 条本地记录。'}catch(e){$('backupStatus').textContent='导出失败：'+e.message}};
$('importStudyData').onclick=()=>$('studyBackupFile').click();
$('studyBackupFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.format!=='cs-english-reading-backup'||data.version!==1||!data.items||typeof data.items!=='object')throw Error('文件格式不正确或版本不支持');const entries=Object.entries(data.items).filter(([k,v])=>backupPrefixes.some(p=>k.startsWith(p))&&typeof v==='string');if(!entries.length)throw Error('备份中没有可恢复的精读记录');if(!confirm('将导入 '+entries.length+' 条记录。相同键的现有记录会被备份内容覆盖，是否继续？'))return;entries.forEach(([k,v])=>localStorage.setItem(k,v));$('backupStatus').textContent='成功恢复 '+entries.length+' 条记录；刷新页面后更新复习状态。';renderList();if(selected&&groups.has(selected))renderDetail(groups.get(selected));}catch(err){$('backupStatus').textContent='导入失败：'+err.message}finally{e.target.value=''}};
$('reset').onclick=()=>{$('year').value='all';$('section').value='all';$('theme').value='all';$('reviewStatus').value='all';$('search').value='';renderList()};const params=new URLSearchParams(location.search);if(params.has('theme')&&topicThemes.some(t=>t.id===params.get('theme'))){$('theme').value=params.get('theme');}if(params.has('word'))$('search').value=params.get('word');renderList();
}catch(e){$('detail').innerHTML='<div class="empty">索引加载失败：'+esc(e.message)+'。请刷新页面后重试。</div>'}
})();
</script></body></html>

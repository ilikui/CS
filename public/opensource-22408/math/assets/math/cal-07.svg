<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">微分方程｜斜率场与解曲线</title><desc id="desc">考研数学二概念动态演示，展示数学对象随参数变化的几何意义。</desc><rect width="720" height="330" rx="18" fill="#fff"/><text x="26" y="30" font-size="18" font-weight="700" fill="#20324a">微分方程｜斜率场与解曲线</text><g stroke="#d9e3ee" stroke-width="1"><path d="M100 80H630M100 130H630M100 180H630M100 230H630M150 55V265M250 55V265M350 55V265M450 55V265M550 55V265"/></g><g stroke="#9aabc0" stroke-width="3" stroke-linecap="round"><path d="M135 95l20 8M235 95l22 18M335 95l24 25M435 95l24 30M535 95l24 34M135 145l20 1M235 145l20 8M335 145l22 15M435 145l23 22M535 145l24 25M135 195l20-8M235 195l20-4M335 195l20 3M435 195l22 9M535 195l23 15"/></g><path d="M115 230 C190 215 230 185 290 160 S430 120 620 90" fill="none" stroke="#287fc1" stroke-width="4"><animate attributeName="stroke-dashoffset" values="260;0" dur="5s" repeatCount="indefinite"/></path><circle cx="115" cy="230" r="7" fill="#d97735"><animate attributeName="cx" values="115;620;115" dur="7s" repeatCount="indefinite"/><animate attributeName="cy" values="230;90;230" dur="7s" repeatCount="indefinite"/></circle><text x="115" y="45" font-size="16" fill="#287fc1">y′ = F(x,y)：每点给出局部斜率</text><text x="26" y="315" font-size="12" fill="#64748b">示意图用于理解几何关系；定理条件与计算以知识卡正文为准。</text></svg>
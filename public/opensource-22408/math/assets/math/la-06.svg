<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">二次型与正定性｜等高线从椭圆到双曲线</title><desc id="desc">考研数学二概念动态演示，展示数学对象随参数变化的几何意义。</desc><rect width="720" height="330" rx="18" fill="#fff"/><text x="26" y="30" font-size="18" font-weight="700" fill="#20324a">二次型与正定性｜等高线从椭圆到双曲线</text><path d="M100 250H640M360 280V55" stroke="#9aa9ba" stroke-width="2"/><ellipse cx="360" cy="165" rx="190" ry="75" fill="#9fc9ed" fill-opacity=".15" stroke="#287fc1" stroke-width="3"/><ellipse cx="360" cy="165" rx="135" ry="52" fill="none" stroke="#287fc1" stroke-width="2"/><ellipse cx="360" cy="165" rx="75" ry="28" fill="none" stroke="#287fc1" stroke-width="2"/><path d="M360 165L525 100" stroke="#269b73" stroke-width="4"><animate attributeName="d" values="M360 165L525 100;M360 165L440 55;M360 165L525 100" dur="5s" repeatCount="indefinite"/></path><text x="500" y="85" font-size="16" fill="#269b73">主轴方向</text><text x="110" y="65" font-size="16" fill="#287fc1">xᵀAx = c：正定时 c&gt;0 为椭圆</text><text x="400" y="270" font-size="14" fill="#60738c">旋转主轴对应正交特征向量</text><text x="26" y="315" font-size="12" fill="#64748b">示意图用于理解几何关系；定理条件与计算以知识卡正文为准。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">特征值与特征向量｜方向不变只伸缩</title><desc id="desc">考研数学二概念动态演示，展示数学对象随参数变化的几何意义。</desc><rect width="720" height="330" rx="18" fill="#fff"/><text x="26" y="30" font-size="18" font-weight="700" fill="#20324a">特征值与特征向量｜方向不变只伸缩</text><path d="M100 250H640M130 280V55" stroke="#9aa9ba" stroke-width="2"/><path d="M180 220L330 145" stroke="#287fc1" stroke-width="5"/><path d="M180 220L520 50" stroke="#269b73" stroke-width="5"><animate attributeName="d" values="M180 220L330 145;M180 220L520 50;M180 220L330 145" dur="5s" repeatCount="indefinite"/></path><path d="M330 145L520 50" stroke="#d97735" stroke-width="2" stroke-dasharray="6 5"/><circle cx="180" cy="220" r="7" fill="#252a31"/><text x="260" y="190" font-size="15" fill="#287fc1">v</text><text x="490" y="42" font-size="16" fill="#269b73">Av = λv</text><text x="370" y="185" font-size="15" fill="#d97735">λ：伸缩倍数</text><text x="110" y="65" font-size="15" fill="#60738c">特征向量方向保持在同一直线上</text><text x="26" y="315" font-size="12" fill="#64748b">示意图用于理解几何关系；定理条件与计算以知识卡正文为准。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">行列式｜单位正方形映射为平行四边形</title><desc id="desc">考研数学二概念动态演示，展示数学对象随参数变化的几何意义。</desc><rect width="720" height="330" rx="18" fill="#fff"/><text x="26" y="30" font-size="18" font-weight="700" fill="#20324a">行列式｜单位正方形映射为平行四边形</text><path d="M100 255H630M130 280V55" stroke="#9aa9ba" stroke-width="2"/><path d="M220 220L360 220L360 90L220 90Z" fill="#9fc9ed" fill-opacity=".25" stroke="#287fc1" stroke-width="3"/><path d="M220 220L430 190L500 65L290 95Z" fill="#269b73" fill-opacity=".28" stroke="#269b73" stroke-width="4"><animate attributeName="d" values="M220 220L430 190L500 65L290 95Z;M220 220L470 220L470 90L220 90Z;M220 220L430 190L500 65L290 95Z" dur="6s" repeatCount="indefinite"/></path><text x="145" y="65" font-size="16" fill="#287fc1">原单位面积 = 1</text><text x="420" y="45" font-size="16" fill="#269b73">面积缩放 = |det A|</text><text x="435" y="240" font-size="14" fill="#269b73">方向可翻转，面积取绝对值</text><text x="26" y="315" font-size="12" fill="#64748b">示意图用于理解几何关系；定理条件与计算以知识卡正文为准。</text></svg>
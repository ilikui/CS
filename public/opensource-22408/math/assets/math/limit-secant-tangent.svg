<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t d"><title id="t">割线趋近切线的极限动画</title><desc id="d">函数 y 等于 x 平方，移动点逐渐靠近 x 等于 1 的切点，割线斜率趋近 2。</desc><rect width="720" height="330" rx="18" fill="#fff"/><text x="28" y="34" font-size="20" font-weight="700" fill="#20324a">割线 → 切线：h → 0</text><path d="M55 270H660 M120 295V65" stroke="#9aa9ba" stroke-width="2"/><path d="M120 270 Q280 270 560 55" fill="none" stroke="#2f80c9" stroke-width="4"/><path d="M260 270L470 112" stroke="#269b73" stroke-width="3" stroke-dasharray="7 6"/><path d="M260 270L560 70" stroke="#e17b36" stroke-width="4"><animate attributeName="d" values="M260 270L560 70;M260 270L470 112;M260 270L390 170;M260 270L330 220;M260 270L300 240;M260 270L300 240" dur="5s" repeatCount="indefinite"/></path><circle cx="260" cy="270" r="7" fill="#269b73"/><circle r="7" fill="#e17b36"><animate attributeName="cx" values="560;470;390;330;300;300" dur="5s" repeatCount="indefinite"/><animate attributeName="cy" values="70;112;170;220;240;240" dur="5s" repeatCount="indefinite"/></circle><text x="500" y="75" font-size="17" fill="#e17b36">移动点 P(a+h)</text><text x="275" y="295" font-size="16" fill="#269b73">固定点 A(a)</text><text x="480" y="155" font-size="16" fill="#20324a">差商 → f′(a)</text><text x="28" y="318" font-size="14" fill="#60738c">当 h 趋近 0，割线方向趋近切线方向；导数是差商的极限。</text></svg>
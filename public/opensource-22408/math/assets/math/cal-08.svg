<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">多元微分与二重积分｜曲面高度和区域累积</title><desc id="desc">考研数学二概念动态演示，展示数学对象随参数变化的几何意义。</desc><rect width="720" height="330" rx="18" fill="#fff"/><text x="26" y="30" font-size="18" font-weight="700" fill="#20324a">多元微分与二重积分｜曲面高度和区域累积</text><path d="M85 250L350 295L635 235" fill="none" stroke="#9aa9ba" stroke-width="2"/><path d="M85 250L85 90M350 295V135M635 235V75" stroke="#9aa9ba" stroke-width="2"/><path d="M130 210 Q300 55 570 170 Q420 285 130 210Z" fill="#9bc7eb" opacity=".55" stroke="#287fc1" stroke-width="3"/><path d="M180 205L180 240M250 150L250 260M320 125L320 275M390 130L390 280M460 150L460 260M520 175L520 245" stroke="#269b73" stroke-width="3" stroke-dasharray="5 4"/><path d="M130 210 Q300 55 570 170" fill="none" stroke="#287fc1" stroke-width="4"/><circle cx="320" cy="125" r="7" fill="#d97735"><animate attributeName="cx" values="180;320;460;180" dur="6s" repeatCount="indefinite"/></circle><text x="115" y="65" font-size="16" fill="#287fc1">z = f(x,y)</text><text x="420" y="305" font-size="15" fill="#269b73">dA = dx dy（极坐标：r dr dθ）</text><text x="26" y="315" font-size="12" fill="#64748b">示意图用于理解几何关系；定理条件与计算以知识卡正文为准。</text></svg>
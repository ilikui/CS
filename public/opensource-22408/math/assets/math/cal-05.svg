<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">中值定理｜割线斜率等于某点切线斜率</title><desc id="desc">考研数学二概念动态演示，展示数学对象随参数变化的几何意义。</desc><rect width="720" height="330" rx="18" fill="#fff"/><text x="26" y="30" font-size="18" font-weight="700" fill="#20324a">中值定理｜割线斜率等于某点切线斜率</text><path d="M70 255H650M100 280V55" stroke="#9aa9ba" stroke-width="2"/><path d="M130 230 Q330 20 590 210" fill="none" stroke="#287fc1" stroke-width="4"/><path d="M130 230L590 210" stroke="#d97735" stroke-width="3" stroke-dasharray="8 5"/><path d="M340 115L510 190" stroke="#269b73" stroke-width="3"><animate attributeName="d" values="M250 165L420 235;M300 135L470 205;M340 115L510 190;M390 100L560 175;M340 115L510 190" dur="6s" repeatCount="indefinite"/></path><circle cx="130" cy="230" r="6" fill="#d97735"/><circle cx="590" cy="210" r="6" fill="#d97735"/><text x="135" y="265" font-size="15" fill="#d97735">a</text><text x="590" y="245" font-size="15" fill="#d97735">b</text><text x="365" y="65" font-size="16" fill="#269b73">存在 ξ：f′(ξ) = [f(b)-f(a)]/(b-a)</text><text x="26" y="315" font-size="12" fill="#64748b">示意图用于理解几何关系；定理条件与计算以知识卡正文为准。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">连续与间断｜左右极限和函数值</title><desc id="desc">考研数学二概念动态演示，展示数学对象随参数变化的几何意义。</desc><rect width="720" height="330" rx="18" fill="#fff"/><text x="26" y="30" font-size="18" font-weight="700" fill="#20324a">连续与间断｜左右极限和函数值</text><path d="M70 255H650M110 280V55" stroke="#9aa9ba" stroke-width="2"/><path d="M120 215L300 95" stroke="#287fc1" stroke-width="4"/><path d="M300 95L470 215" stroke="#287fc1" stroke-width="4"/><circle cx="300" cy="95" r="7" fill="white" stroke="#287fc1" stroke-width="3"/><circle cx="300" cy="170" r="7" fill="#d97735"/><path d="M500 210L500 75" stroke="#269b73" stroke-width="3" stroke-dasharray="6 5"/><path d="M470 145H530" stroke="#d97735" stroke-width="3"/><text x="125" y="65" font-size="16" fill="#287fc1">左极限</text><text x="325" y="90" font-size="16" fill="#287fc1">右极限相等</text><text x="315" y="185" font-size="15" fill="#d97735">函数值可不同</text><text x="520" y="70" font-size="14" fill="#269b73">间断类型</text><text x="26" y="315" font-size="12" fill="#64748b">示意图用于理解几何关系；定理条件与计算以知识卡正文为准。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">矩阵与秩｜线性变换压缩维度</title><desc id="desc">考研数学二概念动态演示，展示数学对象随参数变化的几何意义。</desc><rect width="720" height="330" rx="18" fill="#fff"/><text x="26" y="30" font-size="18" font-weight="700" fill="#20324a">矩阵与秩｜线性变换压缩维度</text><path d="M100 250H640M120 280V55" stroke="#9aa9ba" stroke-width="2"/><g stroke="#cbd8e6" stroke-width="1"><path d="M170 80L170 250M220 80L220 250M270 80L270 250M320 80L320 250M370 80L370 250M420 80L420 250M470 80L470 250M520 80L520 250M570 80L570 250M150 100H600M150 150H600M150 200H600"/></g><path d="M180 220L450 220L450 100L180 100Z" fill="#9fc9ed" fill-opacity=".2" stroke="#287fc1" stroke-width="3"/><path d="M180 220L560 220L560 220L180 220Z" fill="#269b73" fill-opacity=".3" stroke="#269b73" stroke-width="4"><animate attributeName="d" values="M180 220L560 220L560 220L180 220Z;M180 220L450 220L450 100L180 100Z;M180 220L560 220L560 220L180 220Z" dur="6s" repeatCount="indefinite"/></path><text x="160" y="65" font-size="16" fill="#287fc1">二维输入空间</text><text x="430" y="255" font-size="16" fill="#269b73">秩 = 输出维数</text><text x="430" y="280" font-size="14" fill="#60738c">压成直线时 rank = 1</text><text x="26" y="315" font-size="12" fill="#64748b">示意图用于理解几何关系；定理条件与计算以知识卡正文为准。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">线性方程组｜几何交点与自由变量</title><desc id="desc">考研数学二概念动态演示，展示数学对象随参数变化的几何意义。</desc><rect width="720" height="330" rx="18" fill="#fff"/><text x="26" y="30" font-size="18" font-weight="700" fill="#20324a">线性方程组｜几何交点与自由变量</text><path d="M90 250H640M130 280V55" stroke="#9aa9ba" stroke-width="2"/><path d="M150 220L560 75" stroke="#287fc1" stroke-width="4"/><path d="M160 80L520 245" stroke="#d97735" stroke-width="4"/><circle cx="365" cy="144" r="8" fill="#269b73"><animate attributeName="r" values="6;11;6" dur="2s" repeatCount="indefinite"/></circle><path d="M150 220L560 75M150 220L560 75" stroke="#287fc1" stroke-width="1"/><text x="400" y="105" font-size="16" fill="#287fc1">方程 1</text><text x="440" y="225" font-size="16" fill="#d97735">方程 2</text><text x="375" y="130" font-size="15" fill="#269b73">交点 = 唯一解</text><text x="105" y="65" font-size="15" fill="#60738c">平行不同：无解；重合：无穷多解</text><text x="26" y="315" font-size="12" fill="#64748b">示意图用于理解几何关系；定理条件与计算以知识卡正文为准。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">定义域和值域｜输入区间与输出范围</title><desc id="desc">考研数学二概念动态演示，展示数学对象随参数变化的几何意义。</desc><rect width="720" height="330" rx="18" fill="#fff"/><text x="26" y="30" font-size="18" font-weight="700" fill="#20324a">定义域和值域｜输入区间与输出范围</text><path d="M70 250H650M110 280V55" stroke="#9aa9ba" stroke-width="2"/><path d="M175 245 Q280 110 360 115 T575 245" fill="none" stroke="#287fc1" stroke-width="4"/><path d="M175 245V270M575 245V270" stroke="#d97735" stroke-width="3"/><path d="M175 245H575" stroke="#269b73" stroke-width="6" opacity=".18"/><text x="175" y="292" fill="#d97735" font-size="15">输入 x</text><text x="575" y="292" fill="#d97735" font-size="15">边界</text><text x="390" y="95" fill="#287fc1" font-size="17">y = f(x)</text><text x="420" y="220" fill="#269b73" font-size="15">输出 y 的范围</text><circle cx="175" cy="245" r="7" fill="#d97735"><animate attributeName="cx" values="175;250;360;470;575;175" dur="7s" repeatCount="indefinite"/></circle><text x="26" y="315" font-size="12" fill="#64748b">示意图用于理解几何关系；定理条件与计算以知识卡正文为准。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">线性相关与线性表示｜向量张成区域</title><desc id="desc">考研数学二概念动态演示，展示数学对象随参数变化的几何意义。</desc><rect width="720" height="330" rx="18" fill="#fff"/><text x="26" y="30" font-size="18" font-weight="700" fill="#20324a">线性相关与线性表示｜向量张成区域</text><path d="M100 250H640M130 280V55" stroke="#9aa9ba" stroke-width="2"/><path d="M180 220L360 220L440 100" fill="none" stroke="#287fc1" stroke-width="4"/><path d="M180 220L360 220L440 100Z" fill="#9fc9ed" opacity=".35"/><path d="M180 220L360 220" stroke="#d97735" stroke-width="5"/><path d="M180 220L440 100" stroke="#269b73" stroke-width="5"/><path d="M180 220L520 160" stroke="#d97735" stroke-width="3" stroke-dasharray="7 5"><animate attributeName="d" values="M180 220L520 160;M180 220L440 100;M180 220L520 160" dur="5s" repeatCount="indefinite"/></path><text x="365" y="235" font-size="15" fill="#d97735">向量 α</text><text x="450" y="105" font-size="15" fill="#269b73">向量 β</text><text x="470" y="145" font-size="15" fill="#287fc1">span{α,β}</text><text x="115" y="65" font-size="16" fill="#287fc1">独立向量张成平面；共线则张成直线</text><text x="26" y="315" font-size="12" fill="#64748b">示意图用于理解几何关系；定理条件与计算以知识卡正文为准。</text></svg>
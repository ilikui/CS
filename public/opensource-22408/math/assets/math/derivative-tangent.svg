<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t d"><title id="t">导数与切线斜率动画</title><desc id="d">切点沿抛物线移动，切线斜率由负变正，展示导数作为瞬时变化率。</desc><rect width="720" height="330" rx="18" fill="#fff"/><text x="28" y="34" font-size="20" font-weight="700" fill="#20324a">导数：切线斜率随位置变化</text><path d="M70 270H660 M360 295V60" stroke="#9aa9ba" stroke-width="2"/><path d="M130 80 Q360 420 590 80" fill="none" stroke="#2f80c9" stroke-width="4" transform="translate(0 0)"/><g><path d="M170 225L550 45" stroke="#e17b36" stroke-width="3"><animate attributeName="d" values="M170 45L550 225;M170 115L550 155;M170 180L550 90;M170 225L550 45;M170 180L550 90;M170 115L550 155;M170 45L550 225" dur="7s" repeatCount="indefinite"/></path><circle cx="360" cy="190" r="8" fill="#e17b36"><animate attributeName="cy" values="110;160;190;160;110" dur="7s" repeatCount="indefinite"/></circle></g><text x="490" y="70" font-size="17" fill="#e17b36">切线</text><text x="28" y="318" font-size="14" fill="#60738c">f′(x₀) = 切线斜率 = 瞬时变化率；切点不同，导数值也不同。</text></svg>
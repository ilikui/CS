<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t d"><title id="t">定积分黎曼和动画</title><desc id="d">矩形数量逐渐增加，矩形面积和逼近曲线下方面积。</desc><rect width="720" height="330" rx="18" fill="#fff"/><text x="28" y="34" font-size="20" font-weight="700" fill="#20324a">定积分：黎曼和逼近累积面积</text><path d="M70 270H660 M90 290V65" stroke="#9aa9ba" stroke-width="2"/><path d="M90 270 Q280 250 610 70" fill="none" stroke="#2f80c9" stroke-width="4"/><g fill="#9fc9ed" stroke="#4389c7" stroke-width="1"><path d="M90 270V260H220V270Z"><animate attributeName="d" values="M90 270V260H610V270Z;M90 270V260H350V270Z;M90 270V260H220V270Z" dur="6s" repeatCount="indefinite"/></path><path d="M90 270V260H220V270Z"><animate attributeName="opacity" values="0.25;1;0.25" dur="3s" repeatCount="indefinite"/></path></g><g fill="#4389c7" opacity=".65"><path d="M90 270V260H155V270Z"/><path d="M155 270V245H220V270Z"/><path d="M220 270V230H285V270Z"/><path d="M285 270V210H350V270Z"/><path d="M350 270V185H415V270Z"/><path d="M415 270V155H480V270Z"/><path d="M480 270V120H545V270Z"/><path d="M545 270V85H610V270Z"><animate attributeName="opacity" values=".2;.9;.2" dur="4s" repeatCount="indefinite"/></path></g><text x="455" y="95" font-size="18" fill="#269b73">Σ 小矩形面积</text><text x="28" y="318" font-size="14" fill="#60738c">分割越细，黎曼和越接近定积分；定积分描述连续累积量。</text></svg>
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数学二｜真题—知识卡独立解题审计</title>
<script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]},startup:{typeset:false}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<style>
:root{--ink:#202833;--muted:#687586;--line:#dfe5ec;--bg:#f4f6f9;--blue:#2865a6;--green:#16734b;--amber:#9b650c;--red:#b43c36}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.75 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1120px;margin:auto;padding:22px 16px 60px}h1{font-size:23px;margin:0 0 5px}.sub{color:var(--muted);margin:0 0 18px}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0}
.stat,.panel,.question{background:#fff;border:1px solid var(--line);border-radius:12px}
.stat{padding:12px}.stat b{display:block;font-size:23px}.stat span{font-size:12px;color:var(--muted)}
.panel{padding:13px;margin:14px 0}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
label{font-size:12px;color:var(--muted);display:block}input,select{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff;color:var(--ink);font:inherit}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.question{margin:10px 0;overflow:hidden}.question summary{cursor:pointer;display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:12px 14px;list-style:none}.question summary::-webkit-details-marker{display:none}
.year{font-weight:700;color:var(--blue)}.qtitle{font-weight:650}.pill{font-size:11px;padding:2px 7px;border-radius:99px;background:#edf2f7;color:#4c5d70}
.pill.ok{background:#e7f5ee;color:var(--green)}.pill.warn{background:#fff3df;color:var(--amber)}.pill.bad{background:#fdeceb;color:var(--red)}
.body{padding:0 14px 16px;border-top:1px solid var(--line)}.body h3{font-size:13px;margin:14px 0 4px;color:#315d8c}.content{white-space:pre-wrap;overflow-wrap:anywhere;background:#f8fafc;padding:10px;border-radius:8px}
.links{display:flex;gap:8px;flex-wrap:wrap}.links a{font-size:12px;border:1px solid var(--line);border-radius:7px;padding:4px 8px}
.method{border-left:3px solid #6d9bc9;padding:7px 10px;margin:8px 0;background:#f7fafd}
.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin:18px}.pager button{border:1px solid var(--line);background:white;border-radius:8px;padding:8px 13px;cursor:pointer}.pager button:disabled{opacity:.4;cursor:not-allowed}
.empty{text-align:center;padding:30px;color:var(--muted)}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body><main>
<h1>数学二真题—知识卡独立解题审计</h1>
<p class="sub">以原始题库为起点逐题检查：题干是否完整、核心卡片是否命中、解题方法是否闭合、参考解析是否足够复现。映射已核验不等于学习者已通过闭卷实测。</p>
<div class="stats">
 <div class="stat"><b id="rawCount">—</b><span>题库原始记录</span></div>
 <div class="stat"><b id="validCount">—</b><span>去重后题目记录</span></div>
 <div class="stat"><b id="verifiedCount">—</b><span>映射已核验</span></div>
 <div class="stat"><b id="pendingCount">—</b><span>原题待核验</span></div>
 <div class="stat"><b id="fragmentCount">—</b><span>重复/孤立答案片段</span></div>
</div>
<div class="panel">
 <div class="filters">
  <label>年份<select id="year"><option value="all">全部年份</option></select></label>
  <label>科目<select id="subject"><option value="all">全部</option><option value="CAL">高等数学</option><option value="LA">线性代数</option></select></label>
  <label>核验状态<select id="status"><option value="all">全部记录</option><option value="verified">映射已核验</option><option value="pending">原题待核验</option><option value="fragments">答案片段（不计题）</option><option value="missing">缺少完整解析</option></select></label>
  <label>搜索题干/卡片/方法<input id="search" placeholder="例如：积分中值、二重积分、LA-05"></label>
 </div>
 <p class="note" id="filterNote">每道题展开后可查看原题、答案、完整解析、核心/次级知识卡和映射依据。</p>
</div>
<div id="list"></div>
<div class="pager"><button id="prev">上一页</button><span id="pageInfo"></span><button id="next">下一页</button></div>
<p class="note"><a href="./cards.html">返回数学二知识卡片</a> · 本审计页直接读取 exam_data.js 与 exam_knowledge_map.js，不复制或伪造题目来源。</p>
</main>
<script src="./exam_data.js?v=20261117-audit1"></script>
<script src="./exam_knowledge_map.js?v=20261117-7"></script>
<script>
(function(){
 const rows=Array.isArray(window.EXAM_DATA)?window.EXAM_DATA:(typeof EXAM_DATA!=="undefined"?EXAM_DATA:[]);
 const map=window.EXAM_KNOWLEDGE_MAP||{};
 const fragment=s=>s==="duplicate-answer-fragment"||s==="orphan-answer-fragment-needs-source";
 const pending=s=>s&&s!=="verified"&&!fragment(s);
 const unique=rows.map((q,i)=>({q,i,m:map[String(i)]||{status:"missing",primary:[],secondary:[]}})).filter(x=>!fragment(x.m.status));
 const verified=unique.filter(x=>x.m.status==="verified");
 const pendingRows=unique.filter(x=>pending(x.m.status)||x.m.status==="missing");
 const fragmentRows=rows.length-unique.length;
 const noSolution=unique.filter(x=>x.m.status==="verified"&&!String(x.q[5]||"").trim());
 document.getElementById("rawCount").textContent=rows.length;
 document.getElementById("validCount").textContent=unique.length;
 document.getElementById("verifiedCount").textContent=verified.length;
 document.getElementById("pendingCount").textContent=pendingRows.length;
 document.getElementById("fragmentCount").textContent=fragmentRows;
 const years=[...new Set(rows.map(q=>String(q[0])))].sort((a,b)=>Number(b)-Number(a));
 const year=document.getElementById("year");
 years.forEach(y=>{const o=document.createElement("option");o.value=y;o.textContent=y;year.append(o)});
 const params=new URLSearchParams(location.search);
 if(params.get("card")){document.getElementById("search").value=params.get("card");document.getElementById("filterNote").textContent="已按知识卡 "+params.get("card")+" 筛选；清空搜索框可查看全部题目。";}
 let page=1;const size=25;
 const esc=s=>String(s??"");
 const badge=(text,cls)=>'<span class="pill '+cls+'">'+text+'</span>';
 function cardLinks(ids,label){if(!ids?.length)return '<span class="pill warn">未关联</span>';return ids.map(id=>'<a href="./cards.html#card-'+encodeURIComponent(id)+'">'+label+'：'+id+'</a>').join("")}
 function statusInfo(x){
  if(x.m.status==="verified")return {t:"映射已核验",c:"ok"};
  if(fragment(x.m.status))return {t:"答案片段",c:"bad"};
  if(x.m.status==="needs-original-figure")return {t:"待找原题图",c:"warn"};
  if(x.m.status==="needs-statement-verification")return {t:"题干待核验",c:"warn"};
  if(x.m.status==="source-inconsistency-needs-verification")return {t:"来源冲突待核验",c:"warn"};
  return {t:"待核验",c:"warn"};
 }
 function render(){
  const y=year.value,sub=document.getElementById("subject").value,st=document.getElementById("status").value,query=document.getElementById("search").value.trim().toLowerCase();
  let data=rows.map((q,i)=>({q,i,m:map[String(i)]||{status:"missing",primary:[],secondary:[]}}));
  if(st!=="fragments")data=data.filter(x=>!fragment(x.m.status));
  if(st==="verified")data=data.filter(x=>x.m.status==="verified");
  if(st==="pending")data=data.filter(x=>pending(x.m.status)||x.m.status==="missing");
  if(st==="fragments")data=data.filter(x=>fragment(x.m.status));
  if(st==="missing")data=data.filter(x=>x.m.status==="verified"&&!String(x.q[5]||"").trim());
  if(y!=="all")data=data.filter(x=>String(x.q[0])===y);
  if(sub!=="all")data=data.filter(x=>[...(x.m.primary||[]),...(x.m.secondary||[])].some(id=>id.startsWith(sub+"-")));
  if(query)data=data.filter(x=>([x.q[0],x.q[1],x.q[2],x.q[3],x.q[4],x.q[5],...(x.m.primary||[]),...(x.m.secondary||[]),x.m.methods,x.m.rationale].join(" ")).toLowerCase().includes(query));
  const pages=Math.max(1,Math.ceil(data.length/size));page=Math.min(page,pages);
  const visible=data.slice((page-1)*size,page*size);
  const list=document.getElementById("list");list.innerHTML="";
  if(!visible.length){list.innerHTML='<div class="panel empty">没有符合条件的记录。</div>';}
  visible.forEach(x=>{
   const stx=statusInfo(x),refs=[...(x.m.primary||[]),...(x.m.secondary||[])];
   const suff=x.m.status==="verified"&&String(x.q[5]||"").trim()?"映射与解析齐全 · 仍需闭卷实测": "不可判定 · 先补原题/解析/映射";
   const el=document.createElement("details");el.className="question";
   const sum=document.createElement("summary");
   sum.innerHTML='<span class="year">'+esc(x.q[0])+'</span><span>'+esc(x.q[1])+'</span><b class="qtitle">第'+esc(x.q[2])+'题</b>'+badge(stx.t,stx.c)+'<span class="pill">'+esc(suff)+'</span>';
   const body=document.createElement("div");body.className="body";
   const links='<div class="links">'+cardLinks(x.m.primary||[],"核心卡")+(x.m.secondary||[]).map(id=>'<a href="./cards.html#card-'+encodeURIComponent(id)+'">次级卡：'+id+'</a>').join("")+'</div>';
   body.innerHTML='<h3>知识卡关联</h3>'+links
    +'<div class="method"><b>关联依据：</b>'+esc(x.m.rationale||"暂无人工核验依据")+'<br><b>解题方法：</b>'+esc(x.m.methods||"待补")+'<br><b>易错点：</b>'+esc(x.m.pitfalls||"待补")+'</div>';
   function block(title,value){const h=document.createElement("h3");h.textContent=title;body.append(h);const d=document.createElement("div");d.className="content";d.textContent=value||"当前记录未提供；不得自动推测。";body.append(d);}
   block("原始题干",x.q[3]);block("参考答案",x.q[4]);block("完整解题过程",x.q[5]);
   el.append(sum,body);list.append(el);
  });
  document.getElementById("pageInfo").textContent="第 "+page+" / "+pages+" 页 · "+data.length+" 条";
  document.getElementById("prev").disabled=page<=1;document.getElementById("next").disabled=page>=pages;
  document.getElementById("prev").onclick=()=>{page--;render()};document.getElementById("next").onclick=()=>{page++;render()};
  if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise([list]).catch(()=>{});
 }
 ["year","subject","status"].forEach(id=>document.getElementById(id).addEventListener("change",()=>{page=1;render()}));
 document.getElementById("search").addEventListener("input",()=>{page=1;render()});
 render();
})();
</script>
</body></html>

const topics={
"CAL-01":["高等数学","第01章","函数定义域与值域","cal"],"CAL-02":["高等数学","第01章","极限与极限计算","cal"],"CAL-03":["高等数学","第01章","连续性与间断点","cal"],"CAL-04":["高等数学","第02章","导数定义与求导","cal"],"CAL-05":["高等数学","第03章","中值定理与函数性态","cal"],"CAL-06":["高等数学","第04章","积分与微积分基本定理","cal"],"CAL-07":["高等数学","第05章","常微分方程","cal"],"CAL-08":["高等数学","第06–07章","多元微分与二重积分","cal"],
"LA-01":["线性代数","第01章","行列式与可逆性","la"],"LA-02":["线性代数","第02章","矩阵运算、初等变换与秩","la"],"LA-03":["线性代数","第03章","线性表示与线性相关","la"],"LA-04":["线性代数","第04章","线性方程组与解空间","la"],"LA-05":["线性代数","第05章","特征值与相似对角化","la"],"LA-06":["线性代数","第06章","二次型与正定性","la"]};
const raw=[
["CAL-01","基础",1,1,"函数 $f(x)=\\sqrt{x-3}$ 的定义域是？",["$[3,+\\infty)$","$(3,+\\infty)$","$(-\\infty,3]$","$\\mathbb R$"],0,"偶次根式要求被开方数非负：$x-3\\ge0$，故 $x\\ge3$，端点 $x=3$ 可以取到。","把根式一律写成严格大于 0，误排除根号为 0 的端点。"],
["CAL-01","理解",2,2,"函数 $f(x)=\\sqrt{\\dfrac{x-1}{x+2}}$ 的定义域是？",["$(-\\infty,-2)\\cup[1,+\\infty)$","$(-\\infty,-2]\\cup[1,+\\infty)$","$(-2,1]$","$(-\\infty,-2)\\cup(1,+\\infty)$"],0,"需满足 $(x-1)/(x+2)\\ge0$ 且 $x\\ne-2$。临界点为 $-2,1$，符号表给出 $(-\\infty,-2)\\cup[1,+\\infty)$。$x=1$ 使根号内为 0 可取，$x=-2$ 分母为 0 不可取。","将分母零点和分子零点同样处理，导致端点取舍错误。"],
["CAL-01","综合",3,3,"函数 $f(x)=\\dfrac1{\\sqrt{x^2-4}}$ 的值域是？",["$(0,+\\infty)$","$[0,+\\infty)$","$(0,1]$","$[1,+\\infty)$"],0,"定义域为 $|x|>2$。此时 $x^2-4$ 遍历 $(0,+\\infty)$，故其平方根也遍历 $(0,+\\infty)$；取倒数仍为 $(0,+\\infty)$。函数值始终为正，趋近 2 的边界时趋于无穷，$|x|\\to\\infty$ 时趋近 0 但不取到。","把极限趋近值 0 当作函数可以取到的值，错误地写成闭区间。"],
["CAL-02","基础",1,1,"$\\lim_{x\\to0}\\dfrac{\\sin 3x}{5x}$ 等于？",["$\\dfrac35$","$\\dfrac53$","$0$","$1$"],0,"拆成 $\\dfrac35\\cdot\\dfrac{\\sin3x}{3x}$，由 $\\lim_{u\\to0}\\sin u/u=1$，结果为 $3/5$。","忘记把分母配成 $3x$，漏掉系数。"],
["CAL-02","理解",2,2,"$\\lim_{x\\to0}\\dfrac{\\sqrt{1+2x}-1}{x}$ 等于？",["$1$","$2$","$0$","不存在"],0,"有理化得 $\\dfrac{2x}{x(\\sqrt{1+2x}+1)}=\\dfrac2{\\sqrt{1+2x}+1}\\to1$。注意分子展开的系数是 2，分母极限为 2，结果其实为 1。","注意：分子有理化后为 $2/(\\sqrt{1+2x}+1)$，极限为 $2/2=1$；不能误把分子系数直接当答案。"],
["CAL-02","综合",3,3,"$\\lim_{x\\to0}\\dfrac{1-\\cos2x}{x^2}$ 等于？",["$1$","$2$","$4$","$0$"],1,"利用 $1-\\cos u\\sim u^2/2$，令 $u=2x$，则分子 $\\sim(2x)^2/2=2x^2$，极限为 2。","把 $u=2x$ 的平方系数遗漏，或误写成 $1-\\cos u\\sim u^2$。"],
["CAL-03","基础",1,1,"函数在 $x=a$ 连续的必要且充分条件是？",["函数值存在即可","极限存在即可","函数值存在且极限等于函数值","左右极限有限即可"],2,"连续要求 $f(a)$ 有定义，$\\lim_{x\\to a}f(x)$ 存在，且极限等于 $f(a)$。三项缺一不可。","只检查极限存在，忽略函数值或两者相等。"],
["CAL-03","理解",2,2,"$f(x)=\\dfrac{x^2-1}{x-1}$（$x\\ne1$），若定义 $f(1)=a$，要使 $f$ 在 1 连续，$a$ 应为？",["$0$","$1$","$2$","任意实数"],2,"对 $x\\ne1$，$f(x)=x+1$，所以 $\\lim_{x\\to1}f(x)=2$。连续要求 $f(1)=2$，即 $a=2$。","把约分后的表达式当成原函数在 $x=1$ 的定义值；约分不自动补定义。"],
["CAL-03","综合",3,3,"设 $f(x)=\\begin{cases}ax+1,&x<1\\\\x^2+2,&x\\ge1\\end{cases}$，若在 $x=1$ 连续，则 $a=$？",["$0$","$1$","$2$","$3$"],2,"左极限为 $a+1$，右侧函数值为 $1^2+2=3$。连续要求 $a+1=3$，故 $a=2$。","检查参数时应比较左极限与函数值；本题正确值是 2，选项按计算对应第 3 项。"],
["CAL-04","基础",1,1,"函数 $f(x)=x^3$ 的导数是？",["$x^2$","$2x$","$3x^2$","$3x$"],2,"由幂函数求导法则 $(x^n)'=nx^{n-1}$，得 $f'(x)=3x^2$。","指数没有减 1，或系数没有乘到前面。"],
["CAL-04","理解",2,2,"$y=(3x^2+1)^5$ 的导数为？",["$5(3x^2+1)^4$","$30x(3x^2+1)^4$","$15x(3x^2+1)^4$","$30x(3x^2+1)^5$"],1,"设外层 $u^5$，导数为 $5u^4$；内层 $u=3x^2+1$ 的导数为 $6x$。链式法则得 $30x(3x^2+1)^4$。","漏乘内层导数 $6x$，或把外层指数处理错误。"],
["CAL-04","综合",3,3,"曲线 $x^2+y^2=25$ 在点 $(3,4)$ 处的切线斜率为？",["$-3/4$","$-4/3$","$3/4$","$4/3$"],0,"两边对 $x$ 求导：$2x+2yy'=0$，所以 $y'=-x/y$。代入 $(3,4)$ 得 $-3/4$。","隐函数求导时把 $y$ 当常数，漏掉 $y'$。"],
["CAL-05","基础",1,1,"拉格朗日中值定理要求函数满足哪组条件？",["在闭区间连续、开区间可导","在闭区间可导即可","只要求端点函数值相等","只要求导数存在一点"],0,"若 $f$ 在 $[a,b]$ 连续、在 $(a,b)$ 可导，则存在 $\\xi\\in(a,b)$ 使 $f'(\\xi)=[f(b)-f(a)]/(b-a)$。","把罗尔定理的端点相等条件误加到拉格朗日定理。"],
["CAL-05","理解",2,2,"若 $f'(x_0)=0$，下列说法正确的是？",["一定是极大值点","一定是极小值点","可能不是极值点","一定是拐点"],2,"$f(x)=x^3$ 在 0 处导数为 0，但导数在两侧均非负且函数穿过驻点，不构成极值。因此驻点只是候选点。","将极值必要条件误当成充分条件。"],
["CAL-05","综合",3,3,"用拉格朗日中值定理证明 $\ln x\\le x-1$（$x\\ge1$）时，关键中值点关系是？",["$\\ln x=1/\\xi$","$\\ln x/(x-1)=1/\\xi$，其中 $1<\\xi<x$","$x-1=\\ln\\xi$","$\\ln x=x/\\xi$"],1,"对 $f(t)=\\ln t$ 在 $[1,x]$ 应用中值定理，存在 $\\xi\\in(1,x)$，使 $\\ln x/(x-1)=f'(\\xi)=1/\\xi<1$。因 $x-1>0$，得 $\\ln x<x-1$（$x=1$ 等号）。","忽略中值点范围，无法推出 $1/\\xi<1$。"],
["CAL-06","基础",1,1,"$\\int 3x^2\\,dx$ 等于？",["$x^3+C$","$6x+C$","$3x^3+C$","$x^2+C$"],0,"幂函数积分：$\\int x^n dx=x^{n+1}/(n+1)+C$（$n\\ne-1$），所以结果为 $x^3+C$。","积分时没有把指数加 1，或忘记积分常数。"],
["CAL-06","理解",2,2,"计算 $\\int xe^x\\,dx$，正确结果是？",["$xe^x+C$","$e^x(x-1)+C$","$e^x(x+1)+C$","$x^2e^x/2+C$"],1,"分部积分取 $u=x,dv=e^xdx$，得 $xe^x-\\int e^xdx=e^x(x-1)+C$。求导可验证。","分部积分公式第二项符号写错，或没有对剩余积分继续计算。"],
["CAL-06","综合",3,3,"$\\int_0^1 2x\\,dx$ 的值是？",["$0$","$1$","$2$","$1/2$"],1,"原函数为 $x^2$，代入上下限得 $1^2-0^2=1$。定积分按上限值减下限值。","把定积分误当成不定积分，或颠倒上下限。"],
["CAL-07","基础",1,1,"一阶线性微分方程的标准形式是？",["$y''+py'+qy=0$","$y'+P(x)y=Q(x)$","$y'=f(x)g(y)$","$Mdx+Ndy=0$"],1,"一阶线性方程对未知函数及其一阶导数呈线性，标准形式为 $y'+P(x)y=Q(x)$。","把二阶常系数方程或可分离变量方程的形式混淆。"],
["CAL-07","理解",2,2,"方程 $y'+2y=e^{-x}$ 的积分因子是？",["$e^x$","$e^{-2x}$","$e^{2x}$","$2e^x$"],2,"标准型中 $P(x)=2$，积分因子 $\\mu=e^{\\int2dx}=e^{2x}$。乘上后左侧成为 $(e^{2x}y)'$。","积分因子指数漏掉积分符号或把系数写成负号。"],
["CAL-07","综合",3,3,"微分方程 $y''-3y'+2y=0$ 的通解为？",["$C_1e^x+C_2e^{2x}$","$C_1e^{-x}+C_2e^{-2x}$","$(C_1+C_2x)e^x$","$C_1\cos x+C_2\sin x$"],0,"特征方程 $r^2-3r+2=0$，根为 $r=1,2$，故通解 $y=C_1e^x+C_2e^{2x}$。","特征方程因式分解符号错误，或把不同实根当作重根。"],
["CAL-08","基础",1,1,"$f(x,y)=x^2y+3y$ 对 $x$ 的偏导数是？",["$2xy$","$x^2+3$","$2xy+3$","$x^2y$"],0,"对 $x$ 求偏导时把 $y$ 看作常数，故 $f_x=2xy$。","对 $x$ 求偏导时错误地对 $y$ 项也求导。"],
["CAL-08","理解",2,2,"函数 $f(x,y)=x^2+y^2$ 在 $(0,0)$ 的驻点类型是？",["严格局部极大值","严格局部极小值","鞍点","无法判断"],1,"$f_x=2x,f_y=2y$，原点为驻点。二阶偏导 $f_{xx}=2,f_{yy}=2,f_{xy}=0$，判别式 $D=4>0$ 且 $f_{xx}>0$，为严格局部极小值。","只求出驻点而没有计算二阶判别式。"],
["CAL-08","综合",3,3,"单位圆域 $x^2+y^2\\le1$ 上，$\\iint_D(x^2+y^2)\\,dA$ 等于？",["$\\pi/4$","$\\pi/2$","$\\pi$","$2\\pi$"],1,"用极坐标：$x^2+y^2=r^2$，$dA=rdrd\\theta$。积分为 $\\int_0^{2\\pi}\\int_0^1r^3drd\\theta=2\\pi\\cdot1/4=\\pi/2$。","忘记雅可比因子 $r$，会把面积元写成 $drd\\theta$。"],
["LA-01","基础",1,1,"二阶单位矩阵 $I_2$ 的行列式是？",["$0$","$1$","$2$","$-1$"],1,"$|I_2|=1\\cdot1-0\\cdot0=1$。单位矩阵行列式恒为 1。","把矩阵阶数或对角元素相加，误当成行列式。"],
["LA-01","理解",2,2,"交换一个方阵的两行，行列式会怎样变化？",["不变","变为原来的相反数","变为 0","变为两倍"],1,"行列式对行具有交替性，交换两行会改变符号；若两行相同，行列式为 0。","把行变换对秩的影响与对行列式的影响混为一谈。"],
["LA-01","综合",3,3,"矩阵 $A=\\begin{pmatrix}1&2\\\\2&k\\end{pmatrix}$ 在何种条件下不可逆？",["$k=2$","$k=3$","$k=4$","$k=5$"],2,"$|A|=k-4$。不可逆当且仅当行列式为 0，因此 $k=4$。","忘记可逆性判断需要令行列式等于 0。"],
["LA-02","基础",1,1,"矩阵 $A$ 的秩等于其行阶梯形矩阵中的什么数量？",["全部元素个数","非零行数","列数","零行数"],1,"行阶梯形矩阵的非零行数等于矩阵秩，也等于主元个数。","把矩阵的行数或列数误认为秩。"],
["LA-02","理解",2,2,"$(AB)^T$ 等于？",["$A^TB^T$","$B^TA^T$","$AB$","$BA$"],1,"乘积转置要反转顺序：$(AB)^T=B^TA^T$。可用维数或元素定义核验。","转置时只给每个因子转置，却忘记乘法顺序反转。"],
["LA-02","综合",3,3,"若 $A$ 为 $3\\times2$ 矩阵、$B$ 为 $2\\times4$ 矩阵，$AB$ 的阶数及秩上界是？",["$2\\times2$，秩≤2","$3\\times4$，秩≤2","$3\\times4$，秩≤3","$4\\times3$，秩≤4"],1,"内维数 2 相同，乘积为 $3\\times4$。且 $r(AB)\\le\\min(r(A),r(B))\\le2$。","矩阵乘积阶数看外维数；秩上界不能超过内维数。"],
["LA-03","基础",1,1,"向量组线性相关的定义是？",["所有向量都为零","存在不全为零的系数使线性组合为零","每个向量都能由其他向量表示","向量个数等于维数"],1,"线性相关指存在一组不全为零的系数，使 $k_1\\alpha_1+\\cdots+k_m\\alpha_m=0$。","误认为每个系数都必须非零；定义只要求不全为零。"],
["LA-03","理解",2,2,"在 $\\mathbb R^2$ 中，任取 3 个向量必然？",["线性无关","线性相关","构成标准正交组","都非零"],1,"二维空间的线性无关向量最多只有 2 个，超过维数的向量组必线性相关。","把“向量非零”与“向量组线性无关”混淆。"],
["LA-03","综合",3,3,"向量 $b=(3,2)^T$ 能否由 $a_1=(1,0)^T,a_2=(0,1)^T$ 线性表示？系数为？",["能，系数为 3、2","能，系数为 2、3","不能","能，但不唯一"],0,"令 $b=c_1a_1+c_2a_2$，比较分量得 $c_1=3,c_2=2$。标准基线性无关，所以表示唯一。","把坐标顺序颠倒，或误以为线性表示系数不唯一。"],
["LA-04","基础",1,1,"齐次线性方程组 $Ax=0$ 一定有哪一个解？",["只有非零解","零解","无解","唯一非零解"],1,"令 $x=0$，恒有 $A0=0$，所以齐次方程组一定有零解。","将“有零解”误解为“只有零解”。"],
["LA-04","理解",2,2,"若未知数有 5 个，系数矩阵秩为 3，齐次方程组解空间维数为？",["2","3","5","8"],0,"齐次方程组解空间维数（零度）为 $n-r(A)=5-3=2$，即有 2 个自由变量。","把秩直接当成自由变量个数。"],
["LA-04","综合",3,3,"非齐次方程组 $Ax=b$ 有解的秩条件是？",["$r(A)>r(A|b)$","$r(A)=r(A|b)$","$r(A)<r(A|b)$","$r(A)=n$ 必须成立"],1,"Kronecker–Capelli 定理：有解当且仅当系数矩阵秩等于增广矩阵秩。唯一解还需秩等于未知数个数。","把有解条件与唯一解条件混为一谈。"],
["LA-05","基础",1,1,"特征值 $\\lambda$ 与特征向量 $x$ 满足？",["$Ax=x+\\lambda$","$Ax=\\lambda x$ 且 $x\\ne0$","$A+x=\\lambda I$","$A\\lambda=x$"],1,"定义为存在非零向量 $x$，使 $Ax=\\lambda x$。移项得 $(A-\\lambda I)x=0$。","漏掉特征向量必须非零的条件。"],
["LA-05","理解",2,2,"矩阵可相似对角化的核心条件是？",["特征值都不为零","有 n 个线性无关特征向量","行列式为 1","矩阵每行元素和相等"],1,"n 阶矩阵可对角化当且仅当存在 n 个线性无关特征向量，可组成可逆矩阵 $P$，使 $P^{-1}AP$ 为对角矩阵。","误把可逆或特征值互异作为必要条件；互异是充分条件之一而非必要条件。"],
["LA-05","综合",3,3,"实对称矩阵一定具有什么性质？",["一定有 n 个互异特征值","一定可正交对角化","一定正定","行列式一定为正"],1,"实对称矩阵的特征值全为实数，属于不同特征值的特征向量正交，并存在正交矩阵 $Q$ 使 $Q^TAQ$ 对角化。","把正交对角化与正定混淆；对称矩阵可有零或负特征值。"],
["LA-06","基础",1,1,"二次型 $x^TAx$ 的矩阵 $A$ 通常取为？",["上三角矩阵","对称矩阵","单位矩阵","反对称矩阵"],1,"任意二次型都可由对称矩阵表示；交叉项 $2a_{ij}x_ix_j$ 对应对称位置 $a_{ij}=a_{ji}$。","把交叉项系数全部放在一个非对角元，导致矩阵表示不对称。"],
["LA-06","理解",2,2,"二次型 $x^2+2xy+y^2$ 的正定性是？",["正定","负定","半正定但非正定","不定"],2,"$x^2+2xy+y^2=(x+y)^2\\ge0$，但在 $(1,-1)$ 处取 0，因此非负但不严格大于 0，是半正定而非正定。","只看到平方项非负就判正定，忽略非零向量处也可能取 0。"],

const bank=raw.map((r,i)=>({id:r[0]+"-"+({基础:"B",理解:"U",综合:"A"}[r[1]]),card:r[0],level:r[1],difficulty:r[2],minutes:r[3],stem:r[4],options:r[5],answer:r[6],explain:r[7],mistake:r[8],...{subject:topics[r[0]][0],chapter:topics[r[0]][1],topic:topics[r[0]][2],group:topics[r[0]][3]}}));
const KEY="math2_tiered_quiz_v1";let records={};try{records=JSON.parse(localStorage.getItem(KEY)||"{}")}catch{}
const esc=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function persist(){localStorage.setItem(KEY,JSON.stringify(records));stats()}
function stats(){const done=bank.filter(q=>records[q.id]?.done).length,correct=bank.filter(q=>records[q.id]?.correct).length;document.getElementById("done").textContent=done;document.getElementById("correct").textContent=correct;document.getElementById("rate").textContent=done?Math.round(correct/done*100)+"%":"—";document.getElementById("bar").style.width=(done/bank.length*100)+"%"}
function check(id){const q=bank.find(x=>x.id===id),sel=document.querySelector('input[name="ans-'+id+'"]:checked');if(!sel){alert("请先选择一个答案。");return}const ok=Number(sel.value)===q.answer;records[id]={done:true,correct:ok,choice:Number(sel.value),updated:new Date().toISOString()};persist();const fb=document.getElementById("fb-"+id);fb.classList.add("show");fb.innerHTML='<h4 class="'+(ok?"good":"bad")+'">'+(ok?"回答正确 ✓":"本题未答对，再看一下推导")+'</h4><p><b>正确答案：</b>'+esc(q.options[q.answer])+'</p><p><b>解析：</b>'+q.explain+'</p><p><b>常见错因：</b>'+q.mistake+'</p>';document.querySelectorAll('[name="ans-'+id+'"]').forEach((x,i)=>{x.disabled=true;x.parentElement.classList.toggle("correct",i===q.answer);x.parentElement.classList.toggle("wrong",i===Number(sel.value)&&!ok)});if(window.MathJax?.typesetPromise)MathJax.typesetPromise([fb])}
function render(){const search=document.getElementById("search").value.trim().toLowerCase(),subject=document.getElementById("subject").value,level=document.getElementById("level").value,state=document.getElementById("state").value;const list=document.getElementById("list");list.innerHTML="";let count=0;const groups=[["cal","高等数学"],["la","线性代数"]];groups.forEach(([g,name])=>{const qs=bank.filter(q=>q.group===g&&(subject==="all"||subject===g)&&(level==="all"||q.level===level)&&(state==="all"||(state==="todo"&&!records[q.id]?.done)||(state==="done"&&records[q.id]?.done)||(state==="wrong"&&records[q.id]?.done&&!records[q.id]?.correct))&&(!search||(q.card+" "+q.topic+" "+q.stem+" "+q.explain).toLowerCase().includes(search)));if(!qs.length)return;count+=qs.length;const h=document.createElement("h2");h.className="section-title";h.textContent=name+" · "+qs.length+" 题";list.append(h);qs.forEach(q=>{const old=records[q.id],el=document.createElement("article");el.className="question";el.innerHTML='<div class="qhead"><strong>'+q.card+'</strong><span>'+esc(q.topic)+'</span><span class="level '+(q.level==="基础"?"basic":q.level==="理解"?"understand":"advanced")+'">'+q.level+'题</span><span class="meta">'+q.subject+' · '+q.chapter+' · 单项选择 · 难度 '+ "★".repeat(q.difficulty)+' · 预计 '+q.minutes+' 分钟</span></div><div class="stem">'+q.stem+'</div><div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="ans-'+q.id+'" value="'+i+'" '+(old?.done?"disabled":"")+' '+(old?.choice===i?"checked":"")+'><span>'+String.fromCharCode(65+i)+'. '+o+'</span></label>').join("")+'</div><div class="actions"><button class="primary" '+(old?.done?"disabled":"")+' onclick="check(\''+q.id+'\')">提交答案</button><button onclick="showAnswer(\''+q.id+'\')">查看完整解析</button><span class="meta">'+(old?.done?(old.correct?"已答对":"已答错"):"尚未作答")+'</span></div><div class="feedback" id="fb-'+q.id+'">'+(old?.done?'<h4 class="'+(old.correct?"good":"bad")+'">'+(old.correct?"回答正确 ✓":"回答错误")+'</h4><p><b>正确答案：</b>'+esc(q.options[q.answer])+'</p><p><b>解析：</b>'+q.explain+'</p><p><b>常见错因：</b>'+q.mistake+'</p>':"")+'</div>';list.append(el);if(old?.done){el.querySelectorAll("input").forEach((x,i)=>{x.parentElement.classList.toggle("correct",i===q.answer);x.parentElement.classList.toggle("wrong",i===old.choice&&!old.correct)})}})});if(!count)list.innerHTML='<div class="empty">没有匹配的题目，试试调整筛选条件。</div>';stats();if(window.MathJax?.typesetPromise)MathJax.typesetPromise([list])}
function showAnswer(id){const q=bank.find(x=>x.id===id),fb=document.getElementById("fb-"+id);fb.classList.add("show");fb.innerHTML='<h4>参考解析</h4><p><b>正确答案：</b>'+esc(q.options[q.answer])+'</p><p><b>解析：</b>'+q.explain+'</p><p><b>常见错因：</b>'+q.mistake+'</p>';if(window.MathJax?.typesetPromise)MathJax.typesetPromise([fb])}
["search","subject","level","state"].forEach(id=>document.getElementById(id).addEventListener(id==="search"?"input":"change",render));
document.getElementById("export").onclick=()=>{const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),records},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="math2-tiered-quiz-records.json";a.click();URL.revokeObjectURL(a.href)};
document.getElementById("reset").onclick=()=>{if(confirm("确定清空本地所有答题记录吗？此操作不可撤销。")){records={};persist();render()}};
render();
</script>
</body></html>

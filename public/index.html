<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><meta name="description" content="CS 学习知识库｜数学、英语、408 与人工智能">
<title>CS · 学习知识库</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
:root{color-scheme:dark;--bg:#0b1120;--panel:#111a2c;--panel2:#172238;--text:#e8eef8;--muted:#93a4bd;--line:#26344b;--accent:#79a9ff;--accent2:#9b8cff;--code:#0a1020}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.75 Inter,"Noto Sans SC",sans-serif}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 22px;background:#0d1525;position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:19px;letter-spacing:.04em;white-space:nowrap}.brand span{color:var(--accent)}.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 9px}.search{margin-left:auto;max-width:420px;width:42%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--text);outline:none}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100vh - 64px)}aside{border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto;background:#0d1525}.side-title{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.14em;padding:4px 10px 12px}.tree button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#bdc9dc;padding:6px 10px;border-radius:7px;cursor:pointer;font:inherit;font-size:13px;line-height:1.5}.tree button:hover,.tree button.active{background:var(--panel2);color:#fff}.tree .folder{color:#e0e8f6;font-weight:600}.tree .child{padding-left:25px}.tree .hidden{display:none}.main{max-width:1100px;width:100%;margin:0 auto;padding:46px clamp(20px,5vw,72px) 100px}.hero{padding:44px 0 34px;border-bottom:1px solid var(--line);margin-bottom:34px}.eyebrow{font-size:12px;color:var(--accent);letter-spacing:.18em;font-weight:700}.hero h1{font-size:clamp(32px,5vw,54px);line-height:1.15;margin:14px 0}.hero p{color:var(--muted);max-width:680px;font-size:16px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;color:var(--muted);font-size:12px}.stat b{color:var(--text);font-size:17px;margin-right:5px}.content{min-height:45vh}.content h1,.content h2,.content h3{line-height:1.35;scroll-margin-top:84px}.content h1{font-size:2.1em}.content h2{font-size:1.55em;margin-top:2.1em;padding-bottom:.45em;border-bottom:1px solid var(--line)}.content h3{font-size:1.2em;margin-top:1.6em}.content p,.content li{color:#cbd6e6}.content blockquote{border-left:3px solid var(--accent);margin:20px 0;padding:8px 18px;background:var(--panel);color:var(--muted)}.content pre{overflow:auto;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:16px}.content code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em}.content :not(pre)>code{background:var(--panel2);padding:2px 5px;border-radius:4px}.content table{border-collapse:collapse;width:100%;display:block;overflow:auto}.content th,.content td{border:1px solid var(--line);padding:9px 12px;text-align:left}.content th{background:var(--panel2)}.content img{max-width:100%;height:auto;border-radius:8px}.content details{background:var(--panel);border:1px solid var(--line);padding:12px 16px;border-radius:9px}.crumb{font-size:12px;color:var(--muted);margin-bottom:18px}.empty{color:var(--muted);padding:30px 0}.footer{border-top:1px solid var(--line);margin-top:60px;padding-top:20px;color:var(--muted);font-size:12px}.mobile{display:none}
@media(max-width:800px){.layout{grid-template-columns:1fr}aside{position:fixed;z-index:4;top:64px;bottom:0;left:0;width:290px;transform:translateX(-100%);transition:transform .2s;box-shadow:20px 0 40px #0008}.layout.open aside{transform:translateX(0)}.mobile{display:block;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px}.search{width:48%}.main{padding-top:25px}}
</style></head>
<body>
<header class="top"><button class="mobile" id="menu">☰</button><div class="brand">CS<span>.</span></div><div class="tag">KNOWLEDGE BASE</div><input id="search" class="search" placeholder="搜索笔记 / Search..." aria-label="搜索笔记"></header>
<div class="layout" id="layout"><aside><div class="side-title">LEARNING PATHS</div><nav class="tree" id="tree"><div class="empty">正在加载知识目录…</div></nav></aside>
<main class="main"><section class="hero" id="hero"><div class="eyebrow">COMPUTER SCIENCE · SELF LEARNING</div><h1>持续积累，<br>持续创造。</h1><p>以知识结构为索引，以问题为入口，构建可持续迭代的计算机科学学习系统。</p><div class="stats"><div class="stat"><b id="count">—</b>篇学习笔记</div><div class="stat"><b>04</b>核心学习方向</div><div class="stat"><b>∞</b>持续更新</div></div></section><div class="crumb" id="crumb">知识库 / 首页</div><article class="content" id="content"><p class="empty">正在连接 GitHub 知识库…</p></article><div class="footer">内容来源 <a href="https://github.com/ilikui/CS" target="_blank" rel="noopener">ilikui/CS</a> · Cloudflare Pages · 由 GitHub 仓库持续更新</div></main></div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>
const OWNER='ilikui',REPO='CS',BRANCH='main',API='https://api.github.com/repos/'+OWNER+'/'+REPO;
let docs=[],treeData=[],selected=null;
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nice(p){return p.split('/').pop().replace(/\.md$/i,'').replace(/[-_]/g,' ')}
async function load(){try{const r=await fetch(API+'/git/trees/'+BRANCH+'?recursive=1',{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('GitHub API '+r.status);const j=await r.json();treeData=j.tree||[];docs=treeData.filter(x=>x.type==='blob'&&(/\.md$/i.test(x.path)||/\.svg$/i.test(x.path))&&!x.path.startsWith('public/')).sort((a,b)=>a.path.localeCompare(b.path,'zh-CN'));$('#count').textContent=docs.filter(x=>x.path.endsWith('.md')).length;renderTree(docs);$('#content').innerHTML='<h2>从目录开始探索</h2><p>左侧导航按仓库目录组织。选择任意 Markdown 文档即可阅读，支持数学公式、表格、代码块与图片。</p><p>你也可以使用顶部搜索框快速定位知识点。</p><h3>学习入口</h3><ul><li><a href="#" data-path="Project/Artificial Intelligence/02_408/CS408.md">408 计算机学科专业基础</a></li><li><a href="#" data-path="Project/Artificial Intelligence/01_数学二/ReadMe.md">数学二</a></li><li><a href="#" data-path="Project/Artificial Intelligence/03_英语二/ReadMe.md">英语二</a></li></ul>'; }catch(e){$('#content').innerHTML='<h2>暂时无法加载仓库目录</h2><p>'+esc(e.message)+'</p><p>请稍后刷新，或直接访问 <a href="https://github.com/ilikui/CS">GitHub 仓库</a>。</p>';}}
function renderTree(list){const groups={};for(const d of list.filter(x=>x.path.endsWith('.md'))){const parts=d.path.split('/');const group=parts.length>1?parts[0]:'根目录';(groups[group]??=[]).push(d)}let html='';for(const [g,items] of Object.entries(groups)){html+='<button class="folder" data-folder="'+esc(g)+'">▾ '+esc(g)+'</button><div class="group">';for(const d of items){html+='<button class="child" data-path="'+esc(d.path)+'">· '+esc(nice(d.path))+'</button>'}html+='</div>'}$('#tree').innerHTML=html;$('#tree').querySelectorAll('[data-path]').forEach(b=>b.addEventListener('click',()=>openDoc(b.dataset.path)));$('#tree').querySelectorAll('[data-folder]').forEach(b=>b.addEventListener('click',()=>b.nextElementSibling.classList.toggle('hidden')));}
async function openDoc(path){selected=path;$('#crumb').textContent='知识库 / '+path;$('#hero').style.display='none';$('#tree').querySelectorAll('[data-path]').forEach(b=>b.classList.toggle('active',b.dataset.path===path));$('#content').innerHTML='<p class="empty">正在加载文档…</p>';try{const url='https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/'+BRANCH+'/'+path.split('/').map(encodeURIComponent).join('/');const r=await fetch(url);if(!r.ok)throw Error('文档读取失败 '+r.status);const md=await r.text();marked.setOptions({gfm:true,breaks:false});$('#content').innerHTML=marked.parse(md);$('#content').querySelectorAll('a').forEach(a=>{if(a.href.startsWith(location.origin))return;a.target='_blank';a.rel='noopener'});if(window.renderMathInElement)renderMathInElement($('#content'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false});$('#content').querySelectorAll('img').forEach(img=>{img.loading='lazy'});history.replaceState(null,'','#doc='+encodeURIComponent(path));$('#layout').classList.remove('open');}catch(e){$('#content').innerHTML='<p>'+esc(e.message)+'</p>';}}
$('#search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();$('#tree').querySelectorAll('[data-path]').forEach(b=>{const show=b.dataset.path.toLowerCase().includes(q);b.style.display=show?'block':'none';if(show)b.parentElement.classList.remove('hidden')})});
$('#menu').addEventListener('click',()=>$('#layout').classList.toggle('open'));
document.addEventListener('click',e=>{const a=e.target.closest('[data-path]');if(a&&a.tagName==='A'){e.preventDefault();openDoc(a.dataset.path)}});
load().then(()=>{const m=location.hash.match(/^#doc=(.+)$/);if(m)openDoc(decodeURIComponent(m[1]));});
</script></body></html>

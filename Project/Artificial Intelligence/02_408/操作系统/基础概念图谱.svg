<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" rx="24" fill="#f7f9fc"/><text x="600" y="58" text-anchor="middle" font-size="32" font-family="sans-serif" font-weight="700" fill="#183153">操作系统：资源管理与控制</text><rect x="430" y="95" width="340" height="70" rx="14" fill="#173f6b"/><text x="600" y="139" text-anchor="middle" font-size="25" fill="white" font-family="sans-serif">操作系统内核</text><g stroke="#7894b2" stroke-width="3" fill="none"><path d="M600 165V215H150V260M600 215H450V260M600 215H750V260M600 215H1050V260"/></g><g font-family="sans-serif" text-anchor="middle"><rect x="55" y="260" width="190" height="110" rx="13" fill="#dceeff" stroke="#4786bd"/><text x="150" y="300" font-size="22" fill="#173f6b">处理机管理</text><text x="150" y="333" font-size="16" fill="#36536f">进程 / 线程 / 调度</text><rect x="355" y="260" width="190" height="110" rx="13" fill="#e3f4e9" stroke="#54a477"/><text x="450" y="300" font-size="22" fill="#205b3b">内存管理</text><text x="450" y="333" font-size="16" fill="#365f48">分页 / 虚拟内存</text><rect x="655" y="260" width="190" height="110" rx="13" fill="#fff0d9" stroke="#d79a3b"/><text x="750" y="300" font-size="22" fill="#80500c">文件管理</text><text x="750" y="333" font-size="16" fill="#76582b">目录 / 分配 / 保护</text><rect x="955" y="260" width="190" height="110" rx="13" fill="#f2e6fa" stroke="#9b70b6"/><text x="1050" y="300" font-size="22" fill="#633b7c">设备管理</text><text x="1050" y="333" font-size="16" fill="#674d78">驱动 / 中断 / DMA</text><path d="M150 370V430H1050V370M450 370V430M750 370V430" stroke="#7894b2" stroke-width="3" fill="none"/><rect x="180" y="430" width="840" height="70" rx="13" fill="#e8edf4" stroke="#91a4ba"/><text x="600" y="473" font-size="22" fill="#183153">并发控制：同步互斥 · 死锁处理 · 保护与安全</text><rect x="180" y="545" width="840" height="75" rx="13" fill="#173f6b"/><text x="600" y="590" font-size="22" fill="white">目标：让多个程序安全、高效、方便地共享计算机资源</text></g></svg>
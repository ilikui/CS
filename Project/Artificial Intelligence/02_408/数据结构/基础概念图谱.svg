<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" rx="24" fill="#f7f9fc"/><text x="600" y="58" text-anchor="middle" font-size="32" font-family="sans-serif" font-weight="700" fill="#183153">数据结构：从数据到算法</text><rect x="455" y="95" width="290" height="66" rx="14" fill="#173f6b"/><text x="600" y="137" text-anchor="middle" font-size="25" fill="white" font-family="sans-serif">数据结构</text><g stroke="#7894b2" stroke-width="3" fill="none"><path d="M600 161V205H160V250M600 205H440V250M600 205H760V250M600 205H1040V250"/><path d="M160 330V390M440 330V390M760 330V390M1040 330V390"/></g><g font-family="sans-serif" text-anchor="middle"><rect x="55" y="250" width="210" height="80" rx="12" fill="#dceeff" stroke="#4786bd"/><text x="160" y="282" font-size="23" fill="#173f6b">逻辑结构</text><text x="160" y="310" font-size="16" fill="#36536f">集合 / 线性 / 树 / 图</text><rect x="335" y="250" width="210" height="80" rx="12" fill="#e3f4e9" stroke="#54a477"/><text x="440" y="282" font-size="23" fill="#205b3b">存储结构</text><text x="440" y="310" font-size="16" fill="#365f48">顺序 / 链式 / 索引 / 散列</text><rect x="655" y="250" width="210" height="80" rx="12" fill="#fff0d9" stroke="#d79a3b"/><text x="760" y="282" font-size="23" fill="#80500c">数据运算</text><text x="760" y="310" font-size="16" fill="#76582b">查找 / 插入 / 删除 / 遍历</text><rect x="935" y="250" width="210" height="80" rx="12" fill="#f2e6fa" stroke="#9b70b6"/><text x="1040" y="282" font-size="23" fill="#633b7c">算法分析</text><text x="1040" y="310" font-size="16" fill="#674d78">时间 / 空间 / 正确性</text><rect x="55" y="390" width="1090" height="100" rx="14" fill="#fff" stroke="#b7c5d5"/><text x="600" y="430" text-anchor="middle" font-size="23" font-family="sans-serif" fill="#183153">典型结构体系</text><text x="600" y="465" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#40566d">线性表 → 栈与队列 → 树与二叉树 → 图 → 查找与排序</text><rect x="190" y="545" width="820" height="75" rx="14" fill="#173f6b"/><t
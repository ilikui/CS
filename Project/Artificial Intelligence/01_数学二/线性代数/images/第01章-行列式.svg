<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="900" height="520" fill="#fff"/><text x="450" y="38" text-anchor="middle" font-size="25" font-weight="bold" fill="#172554">行列式：线性变换的面积缩放因子</text><path d="M120 420H820 M150 465V75" stroke="#334155" stroke-width="2"/><path d="M260 380L420 380L420 220L260 220Z" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/><path d="M520 380L730 300L650 140L440 220Z" fill="#bbf7d0" stroke="#16a34a" stroke-width="4"/><text x="340" y="415" font-size="18" text-anchor="middle">单位正方形</text><text x="600" y="415" font-size="18" text-anchor="middle">变换后的平行四边形</text><text x="565" y="115" font-size="19" fill="#16a34a">面积倍率 = |det A|</text><text x="275" y="480" font-size="20" fill="#334155">det(A)=0 ⇔ 面积压缩为 0 ⇔ A 不可逆</text></svg>
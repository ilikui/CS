<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="900" height="520" fill="#fff"/><text x="450" y="38" text-anchor="middle" font-size="25" font-weight="bold" fill="#172554">二元函数：曲面、切平面与等高线</text><path d="M160 410L470 475L800 365 M160 410V100 M160 410L80 330" fill="none" stroke="#475569" stroke-width="2"/><path d="M220 320 Q430 90 700 300 Q520 470 220 320Z" fill="#bfdbfe" opacity=".65" stroke="#2563eb" stroke-width="4"/><path d="M300 300 Q450 210 620 300 M270 335 Q450 250 660 335 M350 270 Q470 215 570 270" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M360 285L630 220L720 305L450 370Z" fill="#86efac" opacity=".4" stroke="#16a34a" stroke-width="3"/><circle cx="500" cy="285" r="7" fill="#dc2626"/><text x="520" y="270" font-size="18" fill="#dc2626">P(x₀,y₀,z₀)</text><text x="630" y="205" font-size="18" fill="#16a34a">切平面</text><text x="245" y="125" font-size="18" fill="#2563eb">z=f(x,y)</text><text x="250" y="490" font-size="19" fill="#334155">z−z₀=fₓ(x₀,y₀)(x−x₀)+fᵧ(x₀,y₀)(y−y₀)</text></svg>
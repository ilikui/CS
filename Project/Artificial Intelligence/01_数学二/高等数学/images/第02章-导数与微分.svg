<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="900" height="520" fill="#fff"/><text x="450" y="38" text-anchor="middle" font-size="25" font-weight="bold" fill="#172554">导数的几何意义：切线斜率</text><path d="M90 420H820 M150 465V75" stroke="#334155" stroke-width="2"/><path d="M810 414l12 6-12 6 M144 87l6-12 6 12" fill="none" stroke="#334155" stroke-width="2"/><text x="830" y="440" font-size="18">x</text><text x="125" y="70" font-size="18">y</text><path d="M180 390 C280 370 320 250 420 220 S600 210 760 90" fill="none" stroke="#2563eb" stroke-width="5"/><path d="M250 354 L650 146" stroke="#dc2626" stroke-width="3" stroke-dasharray="9 7"/><circle cx="450" cy="211" r="7" fill="#dc2626"/><path d="M450 211V420 M150 211H450" stroke="#94a3b8" stroke-dasharray="5 6"/><text x="465" y="195" font-size="18" fill="#dc2626">切点 (x₀,f(x₀))</text><text x="565" y="135" font-size="18" fill="#dc2626">切线斜率 f′(x₀)</text><text x="480" y="465" font-size="18" fill="#475569">f′(x₀)=lim[h→0] [f(x₀+h)-f(x₀)]/h</text><text x="190" y="120" font-size="17" fill="#2563eb">曲线 y=f(x)</text></svg>
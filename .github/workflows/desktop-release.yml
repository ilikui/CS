name: CS Study Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0"
        required: true
        default: "0.1.0"
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:windows

      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release/
          if (Test-Path src-tauri/target/release/bundle/nsis/*.exe.sig) {
            Copy-Item src-tauri/target/release/bundle/nsis/*.exe.sig release/
          }

      - name: Create release and upload installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', inputs.version) }}
          name: CS Study Desktop ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          generate_release_notes: true
          files: desktop/release/*

      - name: Publish updater manifest
        if: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          $sig = Get-Content "$($exe.FullName).sig" -Raw
          $version = "${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}".Replace("desktop-v", "").Replace("v", "")
          $manifest = @{
            version = $version
            notes = "CS Study Desktop release"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig
                url = "https://github.com/ilikui/CS/releases/download/desktop-v$version/$($exe.Name)"
              }
            }
          } | ConvertTo-Json -Depth 8
          Set-Content -Path latest.json -Value $manifest -Encoding utf8
          gh release upload "desktop-v$version" latest.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}

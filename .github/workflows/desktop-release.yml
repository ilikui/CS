name: CS Study Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0"
        required: true
        default: "0.1.0"
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm install

      # A signing key enables updater bundles. Without it, still build and publish
      # the normal NSIS installer so users can install the desktop app.
      - name: Build signed Windows installer and updater bundle
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: npm run build:windows

      - name: Build unsigned Windows installer (no updater artifact)
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY == '' }}
        run: npx tauri build --bundles nsis --config src-tauri/tauri.release.unsigned.conf.json

      - name: Collect installer and optional updater bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release/
          $archives = Get-ChildItem src-tauri/target/release/bundle/nsis/*.nsis.zip -ErrorAction SilentlyContinue
          foreach ($archive in $archives) {
            Copy-Item $archive.FullName release/
            $signature = "$($archive.FullName).sig"
            if (Test-Path $signature) { Copy-Item $signature release/ }
          }

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', inputs.version) }}
          name: CS Study Desktop ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          generate_release_notes: true
          files: desktop/release/*

      - name: Publish updater manifest
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        shell: pwsh
        run: |
          $archive = Get-ChildItem release/*.nsis.zip | Select-Object -First 1
          $signature = Get-Content "$($archive.FullName).sig" -Raw
          $version = "${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', inputs.version) }}".Replace("desktop-v", "")
          $manifest = @{
            version = $version
            notes = "CS Study Desktop release"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/ilikui/CS/releases/download/desktop-v$version/$($archive.Name)"
              }
            }
          } | ConvertTo-Json -Depth 8
          Set-Content -Path latest.json -Value $manifest -Encoding utf8
          gh release upload "desktop-v$version" latest.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}

name: CS 408 C Labs

on:
  pull_request:
    paths:
      - "Project/Artificial Intelligence/02_408/数据结构/实验代码/**"
      - ".github/workflows/cs408-c-labs.yml"
  push:
    branches: [main]
    paths:
      - "Project/Artificial Intelligence/02_408/数据结构/实验代码/**"
      - ".github/workflows/cs408-c-labs.yml"

permissions:
  contents: read

jobs:
  c11-labs:
    name: Compile and run C11 labs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show compiler version
        run: cc --version

      - name: Compile sorting lab
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -O2 \
            "Project/Artificial Intelligence/02_408/数据结构/实验代码/sorting_lab.c" \
            -o /tmp/sorting_lab

      - name: Run sorting lab assertions
        run: /tmp/sorting_lab

      - name: Compile searching lab
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -O2 \
            "Project/Artificial Intelligence/02_408/数据结构/实验代码/search_lab.c" \
            -o /tmp/search_lab

      - name: Run searching lab assertions
        run: /tmp/search_lab

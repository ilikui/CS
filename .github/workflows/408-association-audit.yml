name: 408 question-card audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/408-association-audit.js'
      - 'data/408/questions_data.js'
      - 'public/opensource-22408/408/cards.html'
      - 'public/opensource-22408/408/cards-questions.js'
      - '.github/workflows/408-association-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build source-backed audit report
        run: node scripts/408-association-audit.js
      - uses: actions/upload-artifact@v4
        with:
          name: 408-association-audit
          path: reports/408-association-audit.json
          retention-days: 14
